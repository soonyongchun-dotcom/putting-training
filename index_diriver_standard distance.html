<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SY Golf - 드라이버 비거리 산출기 (보정판)</title>
    <style>
        :root {
            --primary-color: #0f2b48;
            --accent-color: #2e7d32;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .result-card {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            display: none;
        }

        .main-score-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .score-box {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        .score-box.max {
            border-color: #2e7d32;
            background: #f0fdf4;
        }

        .score-box .label {
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 5px;
        }

        .score-box .number {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary-color);
        }

        .score-box.max .number {
            color: var(--accent-color);
        }

        .score-box .unit {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .metric-item {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #edf2f7;
        }

        .metric-item .val {
            font-size: 16px;
            font-weight: 700;
            color: #2d3748;
        }

        .metric-item .lbl {
            font-size: 11px;
            color: #718096;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SY Golf 드라이버 비거리 산출기 (보정판)</h1>
    <p class="subtitle">선수 인바디(InBody) 측정치 및 필드 실전 데이터 연동 모델</p>

    <div class="form-grid">
        <div class="form-group">
            <label for="gender">성별 구분</label>
            <select id="gender">
                <option value="female" selected>여성 (KLPGA / 여자선수)</option>
                <option value="male">남성 (KPGA / 남자선수)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="height">신장 (cm)</label>
            <input type="number" id="height" value="166">
        </div>

        <div class="form-group">
            <label for="weight">체중 (kg)</label>
            <input type="number" id="weight" value="64">
        </div>

        <div class="form-group">
            <label for="skeletalMuscle">인바디 골격근량 (kg)</label>
            <input type="number" id="skeletalMuscle" step="0.1" value="18.0">
        </div>

        <div class="form-group full-width">
            <label for="bodyFat">체지방률 (%)</label>
            <input type="number" id="bodyFat" step="0.1" value="22.0">
        </div>
    </div>

    <button type="button" onclick="calculateDistance()">드라이버 비거리 산출하기</button>

    <div class="result-card" id="resultCard">
        <div class="main-score-container">
            <div class="score-box">
                <div class="label">평균 드라이버 비거리</div>
                <span class="number" id="avgMeters">0</span>
                <span class="unit">m (<span id="avgYards">0</span> yd)</span>
            </div>
            <div class="score-box max">
                <div class="label">최대 잠재 비거리 (Max)</div>
                <span class="number" id="maxMeters">0</span>
                <span class="unit">m (<span id="maxYards">0</span> yd)</span>
            </div>
        </div>

        <div class="metric-grid">
            <div class="metric-item">
                <div class="val" id="headSpeed">0 mph</div>
                <div class="lbl">추정 헤드스피드</div>
            </div>
            <div class="metric-item">
                <div class="val" id="ballSpeed">0 m/s</div>
                <div class="lbl">추정 볼스피드</div>
            </div>
            <div class="metric-item">
                <div class="val" id="muscleRatio">0%</div>
                <div class="lbl">골격근 비율</div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculateDistance() {
        const gender = document.getElementById('gender').value;
        const height = parseFloat(document.getElementById('height').value) || 0;
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const muscle = parseFloat(document.getElementById('skeletalMuscle').value) || 0;
        const bodyFat = parseFloat(document.getElementById('bodyFat').value) || 0;

        if (height <= 0 || weight <= 0 || muscle <= 0) {
            alert("올바른 신체조건 수치를 입력해주세요.");
            return;
        }

        let avgMeters = 0;
        let maxMeters = 0;

        // 보정된 수식 연산 (미터 단위 산출 후 야드 변환)
        if (gender === 'female') {
            // 여성 선수 보정식: 인바디 골격근량 18kg 기준 평균 215~220m 산출
            avgMeters = 95.5 + (0.32 * height) + (4.6 * muscle) - (0.45 * bodyFat);
            maxMeters = avgMeters * 1.093; // 최대 비거리 (정타 및 지면반발 극대화 시 +9.3%)
        } else {
            // 남성 선수 보정식
            avgMeters = 115.0 + (0.35 * height) + (3.8 * muscle) - (0.50 * bodyFat);
            maxMeters = avgMeters * 1.085;
        }

        const avgYards = avgMeters / 0.9144;
        const maxYards = maxMeters / 0.9144;
        
        // 헤드스피드 및 볼스피드 연산
        const headSpeedMph = (avgYards / 2.52);
        const ballSpeedMs = (headSpeedMph * 1.48) * 0.44704;
        const muscleRatioVal = (muscle / weight) * 100;

        // UI 출력
        document.getElementById('avgMeters').innerText = avgMeters.toFixed(1);
        document.getElementById('avgYards').innerText = avgYards.toFixed(1);
        document.getElementById('maxMeters').innerText = maxMeters.toFixed(1);
        document.getElementById('maxYards').innerText = maxYards.toFixed(1);

        document.getElementById('headSpeed').innerText = headSpeedMph.toFixed(1) + " mph";
        document.getElementById('ballSpeed').innerText = ballSpeedMs.toFixed(1) + " m/s";
        document.getElementById('muscleRatio').innerText = muscleRatioVal.toFixed(1) + "%";

        document.getElementById('resultCard').style.display = 'block';
    }
</script>

</body>
</html>
