<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>골프 라운드 간편 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<style>
:root{
  --bg:#071018;
  --card:#0d2328;
  --accent:#1fb57a;
  --accent-dark:#167a53;
  --text:#E8F0F3;
  --muted:#8fa3ad;
  --danger:#ff7b7b;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  font-size:16px;
  height:100%;
  overflow-y:auto;
}
.container{
  max-width:600px;
  margin:0 auto;
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
h1{
  font-size:24px;
  color:var(--accent);
  margin-bottom:8px;
  text-align:center;
}
.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}
.section{
  margin-bottom:20px;
  padding:12px;
  background:rgba(255,255,255,0.02);
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.05);
}
.section-title{
  font-size:14px;
  color:var(--accent);
  font-weight:700;
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.form-group{
  margin-bottom:12px;
}
.form-label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:4px;
  font-weight:600;
}input, select, textarea{
  width:100%;
  padding:10px;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:6px;
  background:rgba(13,35,40,0.9);
  color:#ffffff;
  font-size:15px;
  font-family:inherit;
  font-weight:500;
}
input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:var(--accent);
  background:rgba(13,35,40,1);
}
select option{
  background:#0d2328;
  color:#ffffff;
  padding:8px;
}
textarea{
  resize:vertical;
  min-height:60px;
}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#04221a;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
  transition:all 0.2s;
}
.btn:active{
  transform:scale(0.98);
}
.btn-secondary{
  background:rgba(255,255,255,0.1);
  color:var(--text);
}
.btn-danger{
  background:var(--danger);
  color:#fff;
}
.hole-nav{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
.hole-nav button{
  flex:1;
  padding:12px;
  font-size:15px;
}
.hole-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:rgba(31,181,122,0.1);
  border-radius:8px;
  margin-bottom:16px;
  border:1px solid rgba(31,181,122,0.2);
}
.hole-number{
  font-size:28px;
  font-weight:800;
  color:var(--accent);
}
.hole-details{
  text-align:right;
  font-size:14px;
}
.hole-details div{
  color:var(--muted);
  margin-bottom:2px;
}
.shot-list{
  margin-top:12px;
}
.shot-item{
  background:rgba(0,0,0,0.3);
  padding:10px;
  border-radius:6px;
  margin-bottom:8px;
  border:1px solid rgba(255,255,255,0.05);
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:all 0.2s ease;
}
.shot-item.selected{
  background:rgba(31,181,122,0.2);
  border:2px solid var(--accent);
  box-shadow:0 0 10px rgba(31,181,122,0.3);
}
.shot-info{
  flex:1;
}
.shot-info div:first-child{
  font-weight:700;
  color:var(--accent);
  margin-bottom:2px;
}
.shot-info div:last-child{
  font-size:13px;
  color:var(--muted);
}
.shot-delete{
  padding:6px 12px;
  background:var(--danger);
  border:none;
  border-radius:4px;
  color:#fff;
  font-size:12px;
  cursor:pointer;
}
.quick-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:16px;
}
.quick-btn{
  padding:12px;
  background:rgba(255,255,255,0.05);
  border:none;
  border-radius:6px;
  color:var(--text);
  font-size:14px;
  cursor:pointer;
  transition:all 0.2s;
  font-weight:600;
}
.quick-btn:active{
  background:var(--accent);
  color:#000;
}
.status-bar{
  display:flex;
  justify-content:space-between;
  padding:8px 12px;
  background:rgba(0,0,0,0.3);
  border-radius:6px;
  margin-bottom:16px;
  font-size:13px;
}
.status-item{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.status-label{
  color:var(--muted);
  font-size:11px;
}
.status-value{
  font-weight:700;
  color:var(--accent);
  font-size:16px;
}
.hidden{display:none;}
.club-select-group{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:12px;
}
.club-select-group select{
  font-size:14px;
  padding:8px;
  font-weight:600;
  border:2px solid rgba(31,181,122,0.3);
}
.club-select-group select:focus{
  border-color:var(--accent);
}
.putter-btn-container{
  margin-top:16px;
  margin-bottom:16px;
  padding:12px;
  background:rgba(255,255,255,0.02);
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.05);
}
.putter-btn{
  width:100%;
  padding:16px;
  background:rgba(255,255,255,0.1);
  border:2px solid rgba(31,181,122,0.3);
  border-radius:8px;
  color:var(--text);
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
}
.putter-btn.active{
  background:var(--accent);
  color:#04221a;
  border-color:var(--accent);
  transform:scale(1.02);
}
#btnLayup{
  transition:all 0.2s;
}
#btnLayup:hover{
  background:rgba(255,193,7,0.3);
}
#btnLayup.active{
  background:rgba(255,193,7,0.5);
  border-color:rgba(255,193,7,0.6);
  transform:scale(1.02);
}
.putter-count{
  text-align:center;
  margin-top:8px;
  font-size:14px;
  color:var(--muted);
}
.putter-count span{
  font-weight:700;
  color:var(--accent);
  font-size:18px;
}

/* 클럽 추천 버튼 호버 효과 */
#clubRecommendButtons button:hover{
  background:var(--accent-dark) !important;
  transform:scale(1.05);
}
#clubRecommendButtons button:active{
  transform:scale(0.95);
}

/* 퍼터 버튼 애니메이션 */
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); box-shadow: 0 0 20px rgba(31,181,122,0.6); }
}

/* ===== 샷 타입 탭 UI ===== */
.shot-tab{
  padding:8px 2px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:6px;
  color:var(--muted);
  font-size:12px;
  cursor:pointer;
  text-align:center;
  font-weight:600;
  transition:all 0.2s;
  line-height:1.5;
}
.shot-tab.active{
  background:var(--accent);
  color:#04221a;
  border-color:var(--accent);
}
.shot-tab:active{ transform:scale(0.96); }
.shot-panel.hidden{ display:none; }
.result-btn-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:6px;
}
.result-btn{
  padding:10px 4px;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.1);
  border-radius:6px;
  color:var(--text);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}
.result-btn.active{
  background:rgba(31,181,122,0.25);
  border-color:var(--accent);
  color:var(--accent);
}
.result-btn:active{ transform:scale(0.96); }
.club-quick-btn{
  padding:8px 12px;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.15);
  border-radius:6px;
  color:var(--text);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
}
.club-quick-btn.active{
  background:rgba(31,181,122,0.25);
  border-color:var(--accent);
  color:var(--accent);
}
.club-quick-btn:active{ transform:scale(0.96); }
</style>
<script src="./supabase.min.js"></script>
</head>
<body>
<div class="container">
  <div style="margin-bottom:8px">
    <button type="button" onclick="window.opener && !window.opener.closed ? window.close() : (window.history.length > 1 ? window.history.back() : (document.referrer ? location.href=document.referrer : window.close()));" style="background:#374151;color:#fff;border:none;border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;">← 메인으로 돌아가기</button>
  </div>
  <h1>⛳ 골프 간편 기록</h1>
  <p class="subtitle">경기 중 빠른 샷 기록용</p>

  <!-- 라운드 기본 정보 -->
  <div class="section" id="roundInfo">
    <div class="section-title">라운드 정보</div>
    <div class="form-group">
      <label class="form-label">선수 이름</label>
      <input type="text" id="playerName" placeholder="이름 입력">
    </div>
    <div class="form-group">
      <label class="form-label">날짜</label>
      <input type="date" id="roundDate">
    </div>
    <div class="form-group">
      <label class="form-label">코스 이름</label>
      <input type="text" id="courseName" placeholder="코스 이름">
    </div>
    <div class="form-group">
      <label class="form-label">거리 단위</label>
      <select id="distanceUnit">
        <option value="yd">Yard (야드)</option>
        <option value="m">Meter (미터)</option>
      </select>
    </div>
    <button type="button" class="btn" id="btnStartRound">라운드 시작</button>
  </div>

  <!-- 홀 기록 화면 -->
  <div class="section hidden" id="recordSection">
    <!-- 진행 상태 바 -->
    <div class="status-bar">
      <div class="status-item">
        <span class="status-label">현재 홀</span>
        <span class="status-value" id="currentHoleNum">1</span>
      </div>
      <div class="status-item">
        <span class="status-label">총 샷</span>
        <span class="status-value" id="totalShots">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">완료</span>
        <span class="status-value" id="completedHoles">0 / 18</span>
      </div>
    </div>

    <!-- 홀 정보 -->
    <div class="hole-info">
      <div class="hole-number" id="holeNumber">0</div>
      <div class="hole-details">
        <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;">
          <span>Hole <span id="holeNumLabel" style="font-weight:700;">1</span></span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:4px;">
          <span>Par</span>
          <select id="holeParInput" style="width:60px;padding:4px;font-size:14px;">
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
          </select>
        </div>
        <div style="display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:4px;flex-wrap:wrap;">
          <input type="number" id="holeYardInput" value="400" min="50" max="700" style="width:65px;padding:4px;font-size:14px;text-align:right;" inputmode="decimal">
          <select id="holeInputUnit" style="width:45px;padding:2px;font-size:12px;">
            <option value="yd">yd</option>
            <option value="m">m</option>
          </select>
          <button type="button" id="btnConvertDistance" style="padding:2px 6px;font-size:11px;background:var(--accent);border:none;border-radius:4px;cursor:pointer;color:#000;font-weight:600;">⇄</button>
          <span style="font-size:11px;color:var(--muted);">=</span>
          <span id="convertedDistance" style="font-size:12px;font-weight:600;color:var(--accent);">-</span>
          <span id="holeDistanceUnitLabel" style="font-size:12px;">yd</span>
        </div>
      </div>
    </div>

    <!-- 홀 탐색 -->
    <div class="hole-nav">
      <button type="button" class="btn btn-secondary" id="btnPrevHole">◀ 이전</button>
      <button type="button" class="btn btn-secondary" id="btnNextHole">다음 ▶</button>
    </div>

    <!-- 샷 기록 탭 UI -->
    <div class="section-title">샷 기록</div>

    <!-- 편집 배너 -->
    <div id="editingBanner" class="hidden" style="background:rgba(31,181,122,0.2);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:13px;color:var(--accent);font-weight:700;display:flex;justify-content:space-between;align-items:center;">
      <span id="editingBannerText">✏️ 샷 수정 중</span>
      <button type="button" onclick="cancelEdit()" style="background:rgba(255,255,255,0.15);border:none;border-radius:4px;padding:4px 10px;color:var(--text);font-size:12px;cursor:pointer;">취소</button>
    </div>

    <!-- 샷 타입 탭 -->
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px;">
      <button type="button" class="shot-tab" data-mode="tee" onclick="switchShotMode('tee')">🏌️<br><span style="font-size:10px;">티샷</span></button>
      <button type="button" class="shot-tab" data-mode="approach" onclick="switchShotMode('approach')">🎯<br><span style="font-size:10px;">세컨/서드</span></button>
      <button type="button" class="shot-tab" data-mode="around" onclick="switchShotMode('around')">🌿<br><span style="font-size:10px;">어프로치</span></button>
      <button type="button" class="shot-tab" data-mode="putt" onclick="switchShotMode('putt')">⛳<br><span style="font-size:10px;">퍼팅</span></button>
      <button type="button" class="shot-tab" data-mode="layup" onclick="switchShotMode('layup')">↩️<br><span style="font-size:10px;">레이업</span></button>
    </div>

    <!-- 패널 1: 티샷 -->
    <div id="panel-tee" class="shot-panel">
      <div class="form-group">
        <label class="form-label">클럽</label>
        <div class="club-select-group">
          <select id="teeClubWood" onchange="if(this.value)document.getElementById('teeClubIron').value=''">
            <option value="">우드/유틸</option>
            <option value="Driver">드라이버</option>
            <option value="3Wood">3W</option>
            <option value="5Wood">5W</option>
            <option value="Utility1">UT1</option>
            <option value="Utility2">UT2</option>
          </select>
          <select id="teeClubIron" onchange="if(this.value)document.getElementById('teeClubWood').value=''">
            <option value="">아이언/웨지</option>
            <option value="4Iron">4I</option>
            <option value="5Iron">5I</option>
            <option value="6Iron">6I</option>
            <option value="7Iron">7I</option>
            <option value="8Iron">8I</option>
            <option value="9Iron">9I</option>
            <option value="PW">PW</option>
            <option value="Wedge1">웨지1</option>
            <option value="Wedge2">웨지2</option>
            <option value="Wedge3">웨지3</option>
            <option value="SW">SW</option>
            <option value="AW">AW</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">결과</label>
        <div class="result-btn-grid" id="teeResultBtns"></div>
        <input type="hidden" id="teeResult" value="Fairway">
      </div>
      <div class="form-group">
        <label class="form-label">티샷 후 남은 거리 <span style="font-size:11px;color:var(--muted);font-weight:400;">(드라이브 거리 계산용)</span></label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="number" id="teeDistance" placeholder="예: 150" style="flex:1;" inputmode="decimal">
          <span id="teeDistanceUnit" style="font-weight:600;color:var(--muted);">yd</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">페널티</label>
        <input type="number" id="teePenalty" value="0" min="0" inputmode="decimal">
      </div>
      <div class="form-group">
        <label class="form-label">메모</label>
        <textarea id="teeNote" placeholder="선택 사항" style="min-height:44px;"></textarea>
      </div>
      <button type="button" class="btn" id="btnSaveTee">저장/수정</button>
    </div>

    <!-- 패널 2: 세컨/서드샷 -->
    <div id="panel-approach" class="shot-panel hidden">
      <div class="form-group" id="approachRecommendSection" style="display:none;">
        <label class="form-label">추천 클럽</label>
        <div id="approachRecommendBtns" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">클럽</label>
        <select id="approachClub">
          <option value="">선택</option>
          <option value="3Wood">3W</option>
          <option value="5Wood">5W</option>
          <option value="Utility1">UT1</option>
          <option value="Utility2">UT2</option>
          <option value="4Iron">4I</option>
          <option value="5Iron">5I</option>
          <option value="6Iron">6I</option>
          <option value="7Iron">7I</option>
          <option value="8Iron">8I</option>
          <option value="9Iron">9I</option>
          <option value="PW">PW</option>
          <option value="Wedge1">웨지1</option>
          <option value="Wedge2">웨지2</option>
          <option value="Wedge3">웨지3</option>
          <option value="SW">SW</option>
          <option value="AW">AW</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">결과</label>
        <div class="result-btn-grid" id="approachResultBtns"></div>
        <input type="hidden" id="approachResult" value="Fairway">
      </div>
      <div class="form-group">
        <label class="form-label" style="color:var(--accent);font-weight:700;">샷 후 핀까지 거리 <span style="font-size:11px;font-weight:400;">(근접도)</span></label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="number" id="approachDistance" placeholder="예: 5" style="flex:1;" inputmode="decimal">
          <span id="approachDistanceUnit" style="font-weight:600;color:var(--muted);">yd</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">페널티</label>
        <input type="number" id="approachPenalty" value="0" min="0" inputmode="decimal">
      </div>
      <div class="form-group">
        <label class="form-label">메모</label>
        <textarea id="approachNote" placeholder="선택 사항" style="min-height:44px;"></textarea>
      </div>
      <button type="button" class="btn" id="btnSaveApproach">저장/수정</button>
    </div>

    <!-- 패널 3: 홀주변 어프로치 -->
    <div id="panel-around" class="shot-panel hidden">
      <div class="form-group">
        <label class="form-label">클럽</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;" id="aroundClubBtns">
          <button type="button" class="club-quick-btn" data-club="SW">SW</button>
          <button type="button" class="club-quick-btn" data-club="AW">AW</button>
          <button type="button" class="club-quick-btn" data-club="Wedge3">웨지3</button>
          <button type="button" class="club-quick-btn" data-club="Wedge2">웨지2</button>
          <button type="button" class="club-quick-btn" data-club="Wedge1">웨지1</button>
          <button type="button" class="club-quick-btn" data-club="PW">PW</button>
          <button type="button" class="club-quick-btn" data-club="9Iron">9I</button>
        </div>
        <input type="hidden" id="aroundClub" value="">
      </div>
      <div class="form-group">
        <label class="form-label">결과</label>
        <div class="result-btn-grid" id="aroundResultBtns"></div>
        <input type="hidden" id="aroundResult" value="Green">
      </div>
      <div class="form-group">

const STORAGE_KEY_BASE = 'golf_quick_record_data';

let restoredAuthSession = null;

function initSupabaseClient(){
  if(!window.supabase) return null;
  if(!supabaseClient){
    // persistSession/autoRefreshToken 비활성화 — URL 파라미터로 세션을 전달하므로
    // SDK가 localStorage에 저장하려는 시도 자체를 막아 Tracking Prevention 경고 제거
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
    });
  }
  return supabaseClient;
}

async function restoreSessionFromLocalAuth(){
  const sb = initSupabaseClient();
  if(!sb) return null;
  try{
    const authRes = await sb.auth.getSession();
    const session = authRes?.data?.session || authRes?.session || null;
    if(session && session.user && session.access_token){
      return session;
    }
  }catch(e){
    console.warn('Failed to restore Supabase session from local auth storage', e);
  }
  return null;
}

function normalizeLoginId(value){
  if(!value) return null;
  let trimmed = String(value).trim();
  if(trimmed === '') return null;
  if (/^".*"$/s.test(trimmed)) {
    trimmed = trimmed.slice(1, -1).trim();
  }
  if(trimmed === '') return null;

  const lower = trimmed.toLowerCase();
  const loginId = lower.includes('@') ? lower.split('@')[0] : lower;
  if(loginId === '') return null;

  if(/^[a-z0-9._-]+$/.test(loginId)){
    return loginId;
  }
  return 'id' + Array.from(new TextEncoder().encode(loginId)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,48);
}

function getPlayerIdFromAuthSession(authSession){
  const authUser = authSession?.user || {};
  const tokenPayload = parseJwtPayload(authSession?.access_token || '');
  const loginId = normalizeLoginId(authUser.user_metadata?.login_id || tokenPayload?.user_metadata?.login_id || '');
  if(loginId) return loginId;
  const email = String(authUser.email || tokenPayload?.email || '').trim().toLowerCase();
  const emailLocal = email.includes('@') ? email.split('@')[0] : '';
  return normalizeLoginId(emailLocal || '');
}

function parseJwtPayload(token){
  if(!token) return null;
  try{
    const parts = token.split('.');
    if(parts.length < 2) return null;
    const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
    const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, '=');
    const json = atob(padded);
    return JSON.parse(json);
  }catch(e){
    console.warn('Failed to parse JWT payload', e);
    return null;
  }
}

function getAuthPlayerId(session){
  const authUser = session?.user || {};
  const tokenPayload = parseJwtPayload(session?.access_token || '');
  const loginId = normalizeLoginId(authUser.user_metadata?.login_id || tokenPayload?.user_metadata?.login_id || '');
  if(loginId) return loginId;
  const email = String(authUser.email || tokenPayload?.email || '').trim().toLowerCase();
  const emailLocal = email.includes('@') ? email.split('@')[0] : '';
  return normalizeLoginId(emailLocal || '');
}

function computeRoundStats(data){
  const holes = Array.isArray(data?.holes) ? data.holes : [];
  let score = 0;
  let putts = 0;
  let fairwaysHit = 0;
  let greensInRegulation = 0;

  holes.forEach(h => {
    if(!h || !Array.isArray(h.shots)) return;
    h.shots.filter(shot => shot && (shot.club || shot.shotType)).forEach(shot => {
      score += 1;
      if(shot.club === 'Putter'){
        putts += 1;
      } else if(typeof shot.putts === 'number' && shot.putts > 0){
        putts += shot.putts;
      }
      if(String(shot.result || '').trim().toLowerCase() === 'fairway') fairwaysHit += 1;
      if(String(shot.result || '').trim().toLowerCase() === 'green') greensInRegulation += 1;
    });
  });

  return { score, putts, fairwaysHit, greensInRegulation };
}

function makeStorageKey(userId, date){
  if(userId && date){
    return `${STORAGE_KEY_BASE}_${userId}_${date}`;
  }
  return STORAGE_KEY_BASE;
}

function getCurrentStorageKey(){
  const date = roundData && roundData.date ? roundData.date : roundDateInput.value;
  return makeStorageKey(loggedInUserId, date);
}

function base64DecodeUnicode(str){
  const decoded = atob(str);
  const percentEncoded = Array.from(decoded).map(ch => '%'+ch.charCodeAt(0).toString(16).padStart(2,'0')).join('');
  return decodeURIComponent(percentEncoded);
}

function getSessionFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get('supabase_session');
  if(!encoded) return null;
  const decodedString = decodeURIComponent(encoded);
  try{
    return JSON.parse(base64DecodeUnicode(decodedString));
  }catch(e){
    console.warn('Invalid supabase_session param after base64DecodeUnicode', e);
    return null;
  }
}

function normalizeSupabaseSession(session){
  if(!session || typeof session !== 'object') return null;
  if(session.data && typeof session.data === 'object'){
    const data = session.data;
    if(data.session && typeof data.session === 'object'){
      session = data.session;
    } else if(data.user && data.access_token){
      session = data;
    }
  }
  if(session.session && typeof session.session === 'object'){
    session = session.session;
  }
  if(session.user && session.access_token) return session;
  return null;
}

async function restoreSessionFromUrl(){
  let rawSession = getSessionFromUrl();
  if(rawSession){
    const normalizedSession = normalizeSupabaseSession(rawSession);
    console.log('restoreSessionFromUrl raw session shape', {
      source: 'url',
      rawKeys: rawSession && typeof rawSession === 'object' ? Object.keys(rawSession) : null,
      hasData: rawSession && typeof rawSession === 'object' ? Boolean(rawSession.data) : false,
      hasSession: rawSession && typeof rawSession === 'object' ? Boolean(rawSession.session) : false,
      normalizedSessionKeys: normalizedSession && typeof normalizedSession === 'object' ? Object.keys(normalizedSession) : null
    });
    if(normalizedSession){
      restoredAuthSession = normalizedSession;
      const aliasId = getAuthPlayerId(normalizedSession);
      loggedInUserId = aliasId || null;
      loggedInUserEmail = normalizedSession.user?.email || null;
      // SDK에 세션 등록 → 토큰 자동 갱신 활성화
      try{
        const sbClient = initSupabaseClient();
        if(sbClient && normalizedSession.access_token && normalizedSession.refresh_token){
          await sbClient.auth.setSession({
            access_token: normalizedSession.access_token,
            refresh_token: normalizedSession.refresh_token
          });
        }
      }catch(setSessionErr){
        console.warn('setSession from URL failed', setSessionErr);
      }
      console.log('Supabase session restored from URL', {
        loggedInUserId,
        loggedInUserEmail,
        sessionFromUrl: normalizedSession,
        authUserMetadata: normalizedSession.user?.user_metadata
      });
      if(!normalizedSession.user){
        console.warn('Supabase session restored but user object is missing from session');
      }
      return;
    }
    console.warn('Supabase session parsed from URL but did not normalize to a valid auth session', {
      rawSession
    });
  }

  const localSession = await restoreSessionFromLocalAuth();
  if(localSession){
    restoredAuthSession = localSession;
    const aliasId = getAuthPlayerId(localSession);
    loggedInUserId = aliasId || null;
    loggedInUserEmail = localSession.user?.email || null;
    console.log('Supabase session restored from local storage auth', {
      loggedInUserId,
      loggedInUserEmail,
      userMetadata: localSession.user?.user_metadata
    });
  }
}

async function saveRoundToSupabase(){
  try{
    // SDK에서 최신 세션을 먼저 가져옴 (access_token 만료 시 자동 갱신)
    const sbClient = initSupabaseClient();
    if(sbClient){
      try{
        const freshRes = await sbClient.auth.getSession();
        const freshSession = freshRes?.data?.session || freshRes?.session || null;
        if(freshSession && freshSession.user && freshSession.access_token){
          restoredAuthSession = freshSession;
        }
      }catch(e){
        console.warn('saveRoundToSupabase: SDK getSession failed, using cached session', e);
      }
    }
    const resolvedAuthSession = restoredAuthSession;
    if(!resolvedAuthSession || !resolvedAuthSession.user){
      console.warn('Supabase auth session missing; cannot sync without login.');
      return false;
    }
    if(typeof navigator !== 'undefined' && navigator.onLine === false){
      console.warn('Offline detected; skipping Supabase sync.');
      return false;
    }
    const authPlayerId = getPlayerIdFromAuthSession(resolvedAuthSession);
    const userEmail = String(resolvedAuthSession.user.email || loggedInUserEmail || '').trim().toLowerCase();
    const tokenPayload = parseJwtPayload(resolvedAuthSession.access_token || '');
    const tokenMetaLoginId = normalizeLoginId(tokenPayload?.user_metadata?.login_id || '');
    let serverAuthLoginId = null;
    try {
      const rpcUrl = `${SUPABASE_URL}/rest/v1/rpc/app_auth_login_id`;
      const rpcResponse = await fetch(rpcUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${resolvedAuthSession.access_token}`
        },
        body: JSON.stringify({})
      });
      if(rpcResponse.ok){
        serverAuthLoginId = await rpcResponse.text();
        serverAuthLoginId = String(serverAuthLoginId || '').trim();
        if (/^".*"$/s.test(serverAuthLoginId)) {
          serverAuthLoginId = serverAuthLoginId.slice(1, -1);
        }
      } else {
        const rpcBody = await rpcResponse.text();
        console.warn('saveRoundToSupabase app_auth_login_id rpc failed', {
          status: rpcResponse.status,
          statusText: rpcResponse.statusText,
          body: rpcBody
        });
      }
    } catch(rpcError) {
      console.warn('saveRoundToSupabase app_auth_login_id rpc exception', rpcError);
    }
    const normalizedServerAuthLoginId = normalizeLoginId(serverAuthLoginId || '');
    const normalizedAuthPlayerId = normalizeLoginId(authPlayerId || '');
    const normalizedTokenMetaLoginId = normalizeLoginId(tokenMetaLoginId || '');
    const normalizedUserEmail = normalizeLoginId(userEmail || '');
    const playerId = normalizedServerAuthLoginId || normalizedAuthPlayerId || normalizedTokenMetaLoginId || normalizedUserEmail;

    if(normalizedServerAuthLoginId && normalizedServerAuthLoginId !== normalizedAuthPlayerId){
      console.warn('Supabase server auth alias differs from client auth alias', {
        normalizedServerAuthLoginId,
        normalizedAuthPlayerId,
        tokenMetaLoginId,
        userEmail
      });
    }

    if(!playerId){
      console.error('Unable to derive a valid Supabase player_id from auth session; aborting sync.', {
        authPlayerId,
        normalizedServerAuthLoginId,
        normalizedAuthPlayerId,
        normalizedTokenMetaLoginId,
        normalizedUserEmail,
        authSessionUser: resolvedAuthSession.user
      });
      return false;
    }

    const stats = computeRoundStats(roundData);
    roundData.score = stats.score;
    roundData.putts = stats.putts;
    roundData.fairwaysHit = stats.fairwaysHit;
    roundData.greensInRegulation = stats.greensInRegulation;

    const rowData = {
      player_id: playerId,
      round_date: roundData.date || roundDateInput.value,
      course: roundData.course || courseNameInput.value.trim(),
      score: stats.score,
      putts: stats.putts,
      fairways_hit: stats.fairwaysHit,
      greens_in_regulation: stats.greensInRegulation,
      notes: roundData.notes || ''
    };
    console.warn('saveRoundToSupabase auth state', {
      authSessionUser: resolvedAuthSession.user,
      authUserMetadata: resolvedAuthSession.user?.user_metadata,
      authPlayerId,
      serverAuthLoginId,
      tokenMetaLoginId,
      userEmail,
      playerId,
      accessTokenPresent: Boolean(resolvedAuthSession.access_token),
      refreshTokenPresent: Boolean(resolvedAuthSession.refresh_token),
      roundDate: rowData.round_date,
      course: rowData.course,
      rowData
    });
    const row = {
      player_id: playerId,
      player_name: roundData.player || playerNameInput.value.trim() || '',
      round_date: roundData.date || roundDateInput.value || new Date().toISOString().slice(0,10),
      course: roundData.course || courseNameInput.value.trim() || '',
      distance_unit: roundData.distanceUnit || distanceUnitSel.value || 'yd',
      round_meta: {
        player: roundData.player || playerNameInput.value.trim() || '',
        date: roundData.date || roundDateInput.value || '',
        course: roundData.course || courseNameInput.value.trim() || '',
        distanceUnit: roundData.distanceUnit || distanceUnitSel.value || 'yd'
      },
      round_payload: { holes: roundData.holes || [] },
      exported_at: new Date().toISOString(),
      source: 'index1_quick_record'
    };

    // 기존 row 조회 (player_id + round_date + course 기준)
    // on_conflict 방식 대신 select→patch/post 방식으로 중복 생성 방지
    const selectUrl = `${SUPABASE_URL}/rest/v1/sytpt_player_rounds`
      + `?player_id=eq.${encodeURIComponent(row.player_id)}`
      + `&round_date=eq.${encodeURIComponent(row.round_date)}`
      + `&course=eq.${encodeURIComponent(row.course)}`
      + `&select=id`
      + `&limit=1`;
    const selectRes = await fetch(selectUrl, {
      method: 'GET',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${resolvedAuthSession.access_token}`,
        'Accept': 'application/json'
      }
    });
    let existingId = null;
    if(selectRes.ok){
      try{
        const rows = await selectRes.json();
        if(Array.isArray(rows) && rows.length > 0) existingId = rows[0].id;
      }catch(_){}
    }

    let response;
    if(existingId){
      // 기존 row 업데이트 (PATCH)
      const patchUrl = `${SUPABASE_URL}/rest/v1/sytpt_player_rounds?id=eq.${encodeURIComponent(existingId)}`;
      response = await fetch(patchUrl, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${resolvedAuthSession.access_token}`,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(row)
      });
    } else {
      // 신규 row 삽입 (POST)
      const insertUrl = `${SUPABASE_URL}/rest/v1/sytpt_player_rounds`;
      response = await fetch(insertUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${resolvedAuthSession.access_token}`,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify([row])
      });
    }

    const errorBody = await response.text();
    if(!response.ok){
      console.warn('Supabase round sync failed', {
        status: response.status,
        statusText: response.statusText,
        body: errorBody,
        existingId,
        row
      });
      return false;
    }
    console.log('Round synced to Supabase', { row, existingId, method: existingId ? 'PATCH' : 'POST' });
    return true;
  }catch(e){
    console.error('saveRoundToSupabase exception', e);
    return false;
  }
}

// 거리 단위 라벨 업데이트
function updateDistanceUnitLabels(){
  const unit = roundData.distanceUnit || 'yd';
  holeDistanceUnitLabel.textContent = unit;
  puttDistanceUnitLabel.textContent = unit;
  // 탭 패널 내 단위 표시 업데이트
  ['teeDistanceUnit','approachDistanceUnit','aroundDistanceUnit'].forEach(id => {
    const el = document.getElementById(id); if(el) el.textContent = unit;
  });
  holeInputUnitEl.value = unit;
  updateConvertedDistance();
}

// 거리 변환 함수
function convertDistance(value, fromUnit, toUnit){
  if(fromUnit === toUnit) return value;
  if(fromUnit === 'yd' && toUnit === 'm'){
    return Math.round(value * 0.9144);
  }
  if(fromUnit === 'm' && toUnit === 'yd'){
    return Math.round(value * 1.09361);
  }
  return value;
}

// 변환된 거리 표시 업데이트
function updateConvertedDistance(){
  const inputValue = Number(holeYardInput.value) || 0;
  const inputUnit = holeInputUnitEl.value;
  const targetUnit = roundData.distanceUnit || 'yd';
  
  if(inputValue > 0){
    const converted = convertDistance(inputValue, inputUnit, targetUnit);
    convertedDistanceEl.textContent = converted;
  } else {
    convertedDistanceEl.textContent = '-';
  }
}

// 거리 변환 버튼 클릭
btnConvertDistance.addEventListener('click', ()=>{
  const inputValue = Number(holeYardInput.value) || 0;
  const inputUnit = holeInputUnitEl.value;
  const targetUnit = roundData.distanceUnit || 'yd';
  
  if(inputValue > 0){
    const converted = convertDistance(inputValue, inputUnit, targetUnit);
    // 변환된 값으로 저장
    roundData.holes[currentHole].yard = converted;
    holeYardInput.value = converted;
    holeInputUnitEl.value = targetUnit; // 입력 단위를 목표 단위로 변경
    saveData();
    updateConvertedDistance();
  }
});

// 상태바 업데이트
function updateStatusBar(){
  let totalShots = 0;
  let completed = 0;
  roundData.holes.forEach(h => {
    // 모든 샷(퍼터 포함)을 총 샷수에 포함
    totalShots += h.shots.length;
    if(h.shots.length > 0) completed++;
  });
  totalShotsEl.textContent = totalShots;
  completedHolesEl.textContent = `${completed} / 18`;

// 샷 리스트 렌더링
function renderShots(){
  const hole = roundData.holes[currentHole];
  shotListEl.innerHTML = '';
  
  hole.shots.forEach((shot, idx) => {
    const div = document.createElement('div');
    div.className = 'shot-item';
    
    // 편집 중인 샷이면 선택된 표시
    if(editingIndex === idx){
      div.classList.add('selected');
    }
    
    const info = document.createElement('div');
    info.className = 'shot-info';
    
    const club = shot.club || '클럽';
    const result = shot.result || '';
    const unit = roundData.distanceUnit || 'yd';
    const dist = shot.distanceToHole != null ? `${shot.distanceToHole}${unit}` : '';
    const puttsInfo = shot.putts > 0 ? ` (${shot.putts}퍼트)` : '';
    
    // 레이업 샷일 경우 특별 표시
    let additionalInfo = '';
    let secondLine = '';
    if(shot.club === 'LayUp' || shot.isLayup){
      // 레이업 샷: 통계 제외 표시
      secondLine = `<div style="font-size:0.9em; color:#ffc107;">레이업 (통계 제외)</div>`;
    } else if(shot.club === 'Putter'){
      // 퍼터 샷: result 표시 안함, 퍼팅 정보만 표시
      const puttDetails = [];
      if(shot.lie) puttDetails.push(shot.lie);
      if(shot.slope) puttDetails.push(shot.slope);
      if(shot.puttStartDistance != null) puttDetails.push(`${shot.puttStartDistance}${unit}`);
      secondLine = puttDetails.length > 0 ? `<div style="font-size:0.9em; color:var(--muted);">${puttDetails.join(', ')}</div>` : '';
    } else {
      // 일반 샷: result와 거리 표시
      secondLine = `<div>${result} ${dist}</div>`;
    }
    
    info.innerHTML = `
      <div>#${idx + 1} ${club}${puttsInfo}</div>
      ${secondLine}
    `;
    
    // 샷 정보 클릭 시 편집 모드로 진입
    info.onclick = () => loadShotForEdit(idx);
    info.style.cursor = 'pointer';
    
    const delBtn = document.createElement('button');
    delBtn.className = 'shot-delete';
    delBtn.textContent = '삭제';
    delBtn.onclick = () => deleteShot(idx);
    
    div.appendChild(info);
    div.appendChild(delBtn);
    shotListEl.appendChild(div);
  });
}

// 샷 편집을 위해 폼에 기존 데이터 로드
function loadShotForEdit(idx){
  const hole = roundData.holes[currentHole];
  const shot = hole.shots[idx];
  
  editingIndex = idx;
  showEditingBanner(idx);
  
  // shotMode 또는 club/isLayup으로 패널 판단
  const mode = shot.shotMode || (
    shot.club === 'Putter' ? 'putt' :
    (shot.isLayup || shot.club === 'LayUp') ? 'layup' :
    idx === 0 ? 'tee' : 'approach'
  );
  
  switchShotMode(mode);
  
  if(mode === 'tee'){
    const woodSel = document.getElementById('teeClubWood');
    const ironSel = document.getElementById('teeClubIron');
    if(['Driver','3Wood','5Wood','Utility1','Utility2'].includes(shot.club)){
      if(woodSel) woodSel.value = shot.club;
      if(ironSel) ironSel.value = '';
    } else {
      if(woodSel) woodSel.value = '';
      if(ironSel) ironSel.value = shot.club || '';
    }
    selectResultBtn('tee', shot.result || 'Fairway');
    const dist = document.getElementById('teeDistance'); if(dist) dist.value = shot.distanceToHole ?? '';
    const pen = document.getElementById('teePenalty'); if(pen) pen.value = shot.penalty || 0;
    const note = document.getElementById('teeNote'); if(note) note.value = shot.note || '';
  } else if(mode === 'approach'){
    const clubSel = document.getElementById('approachClub'); if(clubSel) clubSel.value = shot.club || '';
    if(shot.distanceToHole != null){ const d = document.getElementById('approachDistance'); if(d) d.value = shot.distanceToHole; }
    selectResultBtn('approach', shot.result || 'Green');
    const pen = document.getElementById('approachPenalty'); if(pen) pen.value = shot.penalty || 0;
    const note = document.getElementById('approachNote'); if(note) note.value = shot.note || '';
  } else if(mode === 'around'){
    const aroundClubEl = document.getElementById('aroundClub'); if(aroundClubEl) aroundClubEl.value = shot.club || '';
    document.getElementById('aroundClubBtns')?.querySelectorAll('.club-quick-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.club === shot.club);
    });
    if(shot.distanceToHole != null){ const d = document.getElementById('aroundDistance'); if(d) d.value = shot.distanceToHole; }
    selectResultBtn('around', shot.result || 'Green');
    const pen = document.getElementById('aroundPenalty'); if(pen) pen.value = shot.penalty || 0;
    const note = document.getElementById('aroundNote'); if(note) note.value = shot.note || '';
  } else if(mode === 'putt'){
    if(puttLieEl) puttLieEl.value = shot.lie || 'OnGreen';
    if(puttSlopeEl) puttSlopeEl.value = shot.slope || 'Flat';
    if(puttDistanceEl) puttDistanceEl.value = shot.puttStartDistance || '';
    if(shotNoteInput) shotNoteInput.value = shot.note || '';
  } else if(mode === 'layup'){
    const wood = document.getElementById('layupClubWood');
    const iron = document.getElementById('layupClubIron');
    if(['Driver','3Wood','5Wood','Utility1','Utility2'].includes(shot.club)){
      if(wood) wood.value = shot.club; if(iron) iron.value = '';
    } else {
      if(wood) wood.value = ''; if(iron) iron.value = (shot.club !== 'LayUp' ? shot.club : '') || '';
    }
    const note = document.getElementById('layupNote'); if(note) note.value = shot.note || '';
  }
  
  renderShots();
}

  const absDistance = Math.abs(distance);
  
  // 거리에 따른 클럽 추천
  if(absDistance <= 10){
    clubButtons = [{label: '퍼터', code: 'Putter'}];
  } else if(absDistance <= 50){
    clubButtons = [{label: 'SW', code: 'SW'}, {label: 'AW', code: 'AW'}, {label: 'Wedge3', code: 'Wedge3'}, {label: 'Wedge2', code: 'Wedge2'}];
  } else if(absDistance <= 70){

  } else if(absDistance <= 90){
    clubButtons = [{label: 'Wedge1', code: 'Wedge1'}, {label: 'Wedge2', code: 'Wedge2'}, {label: 'PW', code: 'PW'}, {label: '9I', code: '9Iron'}];
  } else if(absDistance <= 110){
    clubButtons = [{label: 'PW', code: 'PW'}, {label: '9I', code: '9Iron'}, {label: 'Wedge1', code: 'Wedge1'}, {label: '8I', code: '8Iron'}];
  } else if(absDistance <= 130){
    clubButtons = [{label: '9I', code: '9Iron'}, {label: '8I', code: '8Iron'}, {label: 'PW', code: 'PW'}, {label: '7I', code: '7Iron'}];
  } else if(absDistance <= 150){
    clubButtons = [{label: '8I', code: '8Iron'}, {label: '7I', code: '7Iron'}, {label: '9I', code: '9Iron'}, {label: '6I', code: '6Iron'}];
  } else if(absDistance <= 170){
    clubButtons = [{label: '7I', code: '7Iron'}, {label: '6I', code: '6Iron'}, {label: '8I', code: '8Iron'}, {label: '5I', code: '5Iron'}];
  } else if(absDistance <= 190){
    clubButtons = [{label: '6I', code: '6Iron'}, {label: '5I', code: '5Iron'}, {label: '7I', code: '7Iron'}, {label: '4I', code: '4Iron'}];
  } else if(absDistance <= 210){
    clubButtons = [{label: '5I', code: '5Iron'}, {label: '4I', code: '4Iron'}, {label: '6I', code: '6Iron'}, {label: 'UT1', code: 'Utility1'}];
  } else if(absDistance <= 230){
    clubButtons = [{label: '4I', code: '4Iron'}, {label: 'UT1', code: 'Utility1'}, {label: '5I', code: '5Iron'}, {label: 'UT2', code: 'Utility2'}];
  } else if(absDistance <= 250){
    clubButtons = [{label: 'UT1', code: 'Utility1'}, {label: 'UT2', code: 'Utility2'}, {label: '5W', code: '5Wood'}, {label: '4I', code: '4Iron'}];
  } else {
    clubButtons = [{label: '5W', code: '5Wood'}, {label: '3W', code: '3Wood'}, {label: 'UT1', code: 'Utility1'}, {label: 'Driver', code: 'Driver'}];
  }

  clubRecommendButtons.innerHTML = clubButtons.map(club => 
    `<button type="button" onclick="selectRecommendedClub('${club.code}')" style="padding:8px 14px; background:var(--accent); color:#04221a; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:700; transition:all 0.2s ease;">${club.label}</button>`

// 스코어 타입 계산 함수
function getScoreType(strokes, par) {
  const diff = strokes - par;
  if (diff <= -3) return 'albatross';
  if (diff === -2) return 'eagle';
  if (diff === -1) return 'birdie';
  if (diff === 0) return 'par';
  if (diff === 1) return 'bogey';
  if (diff === 2) return 'double';
  if (diff === 3) return 'triple';
  return 'over';
}

// 스코어 메시지 생성 함수
function getScoreMessage(strokes, par) {
  const scoreType = getScoreType(strokes, par);
  const diff = strokes - par;
  
  const messages = {
    'albatross': `🦅 Amazing! Albatross!\nCompleted Par ${par} in ${strokes} strokes!`,
    'eagle': `🦅 Excellent! Eagle!\nCompleted Par ${par} in ${strokes} strokes!`,
    'birdie': `👏 Great! Birdie!\nCompleted Par ${par} in ${strokes} strokes!`,
    'par': `✨ Nice! Par!\nCompleted Par ${par} in ${strokes} strokes!`,
    'bogey': `💪 Bogey. Keep it up on the next hole!\nFinished Par ${par} in ${strokes} strokes.`,
    'double': `🙂 Double Bogey. That's okay!\nFinished Par ${par} in ${strokes} strokes.`,
    'triple': `😊 Triple Bogey. You'll do better next time!\nFinished Par ${par} in ${strokes} strokes.`,
    'over': `🌟 ${Math.abs(diff)} Over. Keep going!\nFinished Par ${par} in ${strokes} strokes.`
  };
  
  return messages[scoreType] || `Completed Par ${par} in ${strokes} strokes.`;
}

// 홀 완료 (다음 홀로)
btnCompleteHole.addEventListener('click', ()=>{
  // 현재 홀의 마지막 퍼팅을 자동으로 홀인 처리
  const currentHoleData = roundData.holes[currentHole];
  if(currentHoleData && currentHoleData.shots && currentHoleData.shots.length > 0){
    // 마지막 퍼터 샷 찾기
    for(let i = currentHoleData.shots.length - 1; i >= 0; i--){
      const shot = currentHoleData.shots[i];
      if(shot && shot.club === 'Putter'){
        // result를 'InHole'로 설정 (비어있거나 이미 값이 있어도 덮어씀)
        shot.result = 'InHole';
        break;
      }
    }

// CSV 내보내기 (원본 분석 파일과 호환되는 형식)
btnExportCSV.addEventListener('click', async ()=>{
  const lines = [];
  
  // 헤더
  const unit = roundData.distanceUnit || 'yd';
  lines.push(['Player', roundData.player, '', 'Date', roundData.date, '', 'Course', roundData.course, '', 'Unit', unit].join(','));
  lines.push('');
  
  // 샷 데이터 헤더 (원본 파일과 동일한 형식)
  const hdr = ['Hole','Par','HoleYard','ShotNumber','ShotType','Result','DistanceToHole','Putts','Penalty','Note','Lie','Slope','PuttStartDistance','Timestamp'];
  lines.push(hdr.join(','));
  
  // 각 홀의 샷 데이터 - 유효한 샷만 포함
  roundData.holes.forEach(hole => {
    if(!hole.shots || hole.shots.length === 0) return;
    
    // 유효한 샷만 필터링 (club/shotType이 있는 것만)
    const validShots = hole.shots.filter(shot => shot && (shot.club || shot.shotType));
    
    validShots.forEach((shot, idx) => {
      // 각 필드를 안전하게 처리
      const shotType = shot.club || shot.shotType || '';
      const result = (shot.result || '').toString().replace(/"/g, '""');
      const distanceVal = (shot.distanceToHole !== null && shot.distanceToHole !== undefined) ? shot.distanceToHole : '';
      const puttsVal = (shot.club === 'Putter') ? (shot.putts || 1) : 0; // 퍼터 샷은 최소 1, 일반 샷은 0
      const penaltyVal = shot.penalty || 0;
      const noteVal = (shot.note || '').toString().replace(/"/g, '""');
      const lieVal = shot.lie || '';
      const slopeVal = shot.slope || '';
      const puttStartVal = (shot.puttStartDistance !== null && shot.puttStartDistance !== undefined) ? shot.puttStartDistance : '';
      const timestampVal = shot.timestamp || new Date().toISOString();
      
      const row = [
        hole.hole,
        hole.par,
        hole.yard || '',
        idx + 1,  // 실제 순서대로 번호 부여
        shotType,
        `"${result}"`,
        distanceVal,
        puttsVal,
        penaltyVal,
        `"${noteVal}"`,
        lieVal,
        slopeVal,
        puttStartVal,
        timestampVal
      ];
      lines.push(row.join(','));
    });
  });
  
  // 홀 요약 섹션
  lines.push('');
  const holeSummaryHdr = ['Hole','Par','Yard','TotalShots','TotalPutts','TotalPenalties'];
  lines.push(holeSummaryHdr.join(','));
  
  roundData.holes.forEach(hole => {
    if(!hole.shots) return;
    const validShots = hole.shots.filter(shot => shot && (shot.club || shot.shotType));
    const totalShots = validShots.length;
    const totalPutts = validShots.reduce((sum, s) => sum + (s.putts || 0), 0);
    const totalPenalties = validShots.reduce((sum, s) => sum + (s.penalty || 0), 0);
    
    // 샷이 있는 홀만 요약에 포함
    if(totalShots > 0){
      lines.push([hole.hole, hole.par, hole.yard || '', totalShots, totalPutts, totalPenalties].join(','));
    }
  });
  
  // 데이터 검증: 최소한 하나의 샷이 있는지 확인
  const totalShotsCount = roundData.holes.reduce((count, hole) => {
    if(!hole.shots) return count;
    const validShots = hole.shots.filter(shot => shot && (shot.club || shot.shotType));
    return count + validShots.length;
  }, 0);
  
  if(totalShotsCount === 0){
    alert('기록된 샷이 없습니다. 먼저 샷을 입력해주세요.');
    return;
  }
  
  // UTF-8 BOM 추가 (한글 깨짐 방지)
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const filename = `golf_quick_${roundData.date || new Date().toISOString().slice(0,10)}.csv`;
  
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 100);
  
  // 서버 동기화 시도
  const syncSuccess = await saveRoundToSupabase();
  if(!syncSuccess){
    console.warn('서버 동기화가 실패했습니다. 코치 포털에 데이터가 반영되지 않을 수 있습니다.');
  }
  
  // 저장 성공 메시지와 함께 통계 정보 표시
  const holesWithData = roundData.holes.filter(h => h.shots && h.shots.some(s => s && (s.club || s.shotType))).length;
  let message = `CSV 파일이 저장되었습니다!\n\n총 ${holesWithData}개 홀, ${totalShotsCount}개 샷 기록`;
  if(!syncSuccess){
    message += '\n\n⚠️ 서버 동기화 실패: 포털에서 로그인 후 이 페이지를 다시 열어주세요.';
  } else {
    message += '\n\n✅ 서버에 저장되었습니다. 코치 포털에서 확인할 수 있습니다.';
  }
  alert(message);
});

function saveData(){

    const isStarted = recordSection && !recordSection.classList.contains('hidden');
    const storageKey = getCurrentStorageKey();
    localStorage.setItem(storageKey, JSON.stringify({
      roundData: roundData,
      currentHole: currentHole,
      started: isStarted
    }));
  }catch(e){
    console.error('저장 실패:', e);
  }
}

// 데이터 복구
function restoreData(){
  try{
    const storageKey = getCurrentStorageKey();
    let raw = localStorage.getItem(storageKey);
    if(!raw && storageKey !== STORAGE_KEY_BASE){
      // 로그인 사용자 기반 키가 없으면 공통 키도 확인
      raw = localStorage.getItem(STORAGE_KEY_BASE);
    }
    if(!raw) return;
    
    const saved = JSON.parse(raw);
    if(saved.roundData){
      roundData = saved.roundData;
      currentHole = saved.currentHole || 0;
      
      playerNameInput.value = roundData.player || '';
      roundDateInput.value = roundData.date || new Date().toISOString().slice(0,10);
      courseNameInput.value = roundData.course || '';
      distanceUnitSel.value = roundData.distanceUnit || 'yd';
      
      if(saved.started){
        roundInfo.classList.add('hidden');
        recordSection.classList.remove('hidden');
        exportSection.classList.remove('hidden');
        updateDistanceUnitLabels(); // 단위 라벨 복원
        updateHoleDisplay();
      }
    }
  }catch(e){
    console.error('복구 실패:', e);
  }
}

function updateApproachClubRecommend(distance){
  const absDistance = Math.abs(distance);
  let clubs = [];
  if(absDistance <= 10) clubs = [{label:'퍼렉', code:'Putter'}];
  else if(absDistance <= 50) clubs = [{label:'SW',code:'SW'},{label:'AW',code:'AW'},{label:'웨지3',code:'Wedge3'}];
  else if(absDistance <= 70) clubs = [{label:'AW',code:'AW'},{label:'웨지1',code:'Wedge1'},{label:'웨지2',code:'Wedge2'},{label:'웨지3',code:'Wedge3'}];
  else if(absDistance <= 90) clubs = [{label:'웨지1',code:'Wedge1'},{label:'웨지2',code:'Wedge2'},{label:'PW',code:'PW'},{label:'9I',code:'9Iron'}];
  else if(absDistance <= 110) clubs = [{label:'PW',code:'PW'},{label:'9I',code:'9Iron'},{label:'8I',code:'8Iron'}];
  else if(absDistance <= 130) clubs = [{label:'9I',code:'9Iron'},{label:'8I',code:'8Iron'},{label:'7I',code:'7Iron'}];
  else if(absDistance <= 150) clubs = [{label:'8I',code:'8Iron'},{label:'7I',code:'7Iron'},{label:'6I',code:'6Iron'}];
  else if(absDistance <= 170) clubs = [{label:'7I',code:'7Iron'},{label:'6I',code:'6Iron'},{label:'5I',code:'5Iron'}];
  else if(absDistance <= 190) clubs = [{label:'6I',code:'6Iron'},{label:'5I',code:'5Iron'},{label:'UT2',code:'Utility2'}];
  else if(absDistance <= 210) clubs = [{label:'5I',code:'5Iron'},{label:'UT1',code:'Utility1'},{label:'UT2',code:'Utility2'}];
  else if(absDistance <= 230) clubs = [{label:'UT1',code:'Utility1'},{label:'5W',code:'5Wood'},{label:'3W',code:'3Wood'}];
  else clubs = [{label:'5W',code:'5Wood'},{label:'3W',code:'3Wood'},{label:'UT1',code:'Utility1'}];

  const section = document.getElementById('approachRecommendSection');
  const btns = document.getElementById('approachRecommendBtns');
  if(!section || !btns) return;
  if(clubs[0].code === 'Putter'){
    section.style.display = 'none';
    return;
  }
  btns.innerHTML = clubs.map(c =>
    `<button type="button" onclick="setApproachClub('${c.code}')" style="padding:8px 14px;background:var(--accent);color:#04221a;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700;transition:all 0.2s;">${c.label}</button>`
  ).join('');
  section.style.display = 'block';
}

    const note = document.getElementById('aroundNote').value.trim();
    if(result === 'InHole'){ putterCount = 0; if(putterCountEl) putterCountEl.textContent = putterCount; }
    const wasEditing = editingIndex >= 0;
    saveShotToHole({ club, result, distanceToHole, putts:0, penalty, note, lie:'', slope:'', puttStartDistance:null, shotMode:'around', timestamp: new Date().toISOString() });
    if(!wasEditing) switchShotMode('putt');
  });

  // 레이업 저장
  const btnSaveLayup = document.getElementById('btnSaveLayup');
  if(btnSaveLayup) btnSaveLayup.addEventListener('click', ()=>{
    const club = document.getElementById('layupClubWood').value || document.getElementById('layupClubIron').value || 'LayUp';
    const note = document.getElementById('layupNote').value.trim() || '레이업 (통계 제외)';
    const hole = roundData.holes[currentHole];
    const existingDistance = (editingIndex >= 0 && hole.shots[editingIndex]) ? hole.shots[editingIndex].distanceToHole : null;
    saveShotToHole({ club, result:'Layup', distanceToHole: existingDistance, putts:0, penalty:0, note, lie:'', slope:'', puttStartDistance:null, isLayup:true, shotMode:'layup', timestamp: new Date().toISOString() });
  });
});

// 탭 패널 초기화
function initShotPanels(){
  initResultBtns('tee');
  initResultBtns('approach');
  initResultBtns('around');
  switchShotMode('tee');
}
</script>
</body>
</html>
