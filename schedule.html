<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 시드전 대비 훈련 스케줄 관리 시스템</title>

  <!-- Tailwind CSS, FontAwesome & SheetJS (완벽 엑셀 바이너리 파서) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    .table-container { overflow-x: auto; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    td[contenteditable="true"]:focus, input:focus {
      outline: 2px solid #2563eb;
      background-color: #eff6ff;
    }
    .access-notice{padding:10px 14px;border:1px solid #fbbf24;border-radius:10px;background:#fffbeb;color:#92400e;font-size:14px}
    .coach-only[hidden],.view-only[hidden]{display:none!important}
  </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header Controls -->
    <header class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-3">
          <i class="fa-solid fa-flag-checkered text-blue-600"></i>
          2026 시드전 대비 훈련 스케줄 관리 시스템
        </h1>
        <p class="text-slate-500 text-sm mt-1">엑셀(.xlsx/.xls) 직접 로드, 바이너리 깨짐 방지 파싱 및 실시간 일정표 능동 생성 웹앱</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap gap-2 w-full lg:w-auto">
        <!-- Excel File Upload Input -->
        <label class="coach-only px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm flex items-center gap-2 cursor-pointer shadow-sm transition" hidden>
          <i class="fa-solid fa-file-excel"></i> 엑셀 파일 불러오기 (.xlsx/.xls)
          <input type="file" id="file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">
        </label>
        
        <button class="coach-only px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm flex items-center gap-2 shadow-sm transition" onclick="addNewRow()" hidden>
          <i class="fa-solid fa-clock-plus"></i> 시간대 추가
        </button>
        <button class="coach-only px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm flex items-center gap-2 shadow-sm transition" onclick="saveData()" hidden>
          <i class="fa-solid fa-floppy-disk"></i> 저장하기
        </button>
        <button onclick="exportToCSV()" class="px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white font-medium rounded-lg text-sm flex items-center gap-2 shadow-sm transition">
          <i class="fa-solid fa-download"></i> CSV/엑셀 내보내기
        </button>
        <button class="coach-only px-4 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 font-medium rounded-lg text-sm flex items-center gap-2 transition" onclick="resetData()" hidden>
          <i class="fa-solid fa-rotate-left"></i> 초기화
        </button>
      </div>
    </header>

    <div id="edit-access-notice" class="access-notice view-only" role="status" hidden></div>

    <!-- Tab Navigation (시트별 탭 자동 생성) -->
    <div id="tab-container" class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-3 gap-2 shadow-sm overflow-x-auto">
      <!-- Dynamic Tabs -->
    </div>

    <!-- Editable Header Card -->
    <div class="bg-gradient-to-r from-slate-900 via-indigo-900 to-blue-900 text-white p-6 rounded-xl shadow-md space-y-4">
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
        <div class="flex-1 w-full">
          <label class="block text-xs font-semibold text-blue-200 mb-1"><i class="fa-solid fa-heading mr-1"></i> 메인 훈련 제목</label>
          <input type="text" id="meta-title" oninput="updateMeta('title', this.value)" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white font-bold text-lg md:text-xl placeholder-white/50" placeholder="훈련 제목을 입력하세요">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-white/10">
        <div>
          <label class="block text-xs font-semibold text-blue-200 mb-1"><i class="fa-regular fa-calendar-days mr-1"></i> 훈련 기간</label>
          <input type="text" id="meta-period" oninput="updateMeta('period', this.value)" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white text-sm font-medium" placeholder="예: 2026.10.19 ~ 2026.10.23">
        </div>
        <div>
          <label class="block text-xs font-semibold text-blue-200 mb-1"><i class="fa-solid fa-location-dot mr-1"></i> 주요 훈련 장소</label>
          <input type="text" id="meta-location" oninput="updateMeta('location', this.value)" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white text-sm font-medium" placeholder="예: 경북 칠곡/구미 파3 및 드라이빙 레인지">
        </div>
      </div>
    </div>

    <!-- Editable Schedule Table -->
    <div class="table-container bg-white rounded-xl border border-slate-200 overflow-hidden">
      <table class="w-full text-left border-collapse min-w-[950px]" id="schedule-table">
        <thead>
          <tr class="bg-slate-800 text-white text-xs uppercase tracking-wider font-semibold">
            <th class="py-3.5 px-4 w-28 text-center border-r border-slate-700">날짜</th>
            <th class="py-3.5 px-3 w-16 text-center border-r border-slate-700">요일</th>
            <th class="py-3.5 px-4 w-36 text-center border-r border-slate-700">시간대 (편집)</th>
            <th class="py-3.5 px-4 w-48 border-r border-slate-700">소제목 / 구분</th>
            <th class="py-3.5 px-6 border-r border-slate-700">세부 훈련 내용 및 평가 미션</th>
            <th class="py-3.5 px-4 w-36 border-r border-slate-700">장소</th>
            <th class="py-3.5 px-4 w-36 border-r border-slate-700">비고</th>
            <th class="coach-only py-3.5 px-3 w-20 text-center" hidden>관리</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-200 text-sm">
          <!-- Dynamic Rows -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2 z-50">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-message">수정사항이 저장되었습니다.</span>
  </div>

          { date: "10/28", day: "수", time: "17:30-18:30", category: "디브리핑", detail: "핀 위치별 클럽 선택 데이터 산출 및 평가", location: "세미나실", note: "데이터 정리" },
          { date: "10/29", day: "목", time: "06:00-08:30", category: "정밀 시각 정렬 워밍업", detail: "시각 축 고정 훈련", location: "연습장", note: "-" },
          { date: "10/29", day: "목", time: "08:30-09:30", category: "프리매치 숏게임/레인지", detail: "10m~30m 숏게임 센스 및 레인지 샷 가공", location: "숏게임장/레인지", note: "숏게임 감각 극대화" },
          { date: "10/29", day: "목", time: "09:30-14:30", category: "3인 실전 타점 경쟁 매치 (Round 2)", detail: "시드전 본선 규정 및 Pace of Play 엄격 적용 (파세이브율 95% 목표)", location: "무안CC 본선 코스", note: "Pace of Play 체크" },
          { date: "10/29", day: "목", time: "14:30-15:30", category: "중식", detail: "식사", location: "클럽하우스", note: "-" },
          { date: "10/29", day: "목", time: "15:30-17:30", category: "라운드 후 클러치 퍼팅 미션", detail: "1.5~2.5m 클러치 파세이브 퍼트 20개 성공 연속 미션", location: "연습그린", note: "숏퍼트 연속 성공 미션" },
          { date: "10/29", day: "목", time: "17:30-18:30", category: "마인드셋 점검", detail: "매치 결과 분석 및 시드전 본선 멘탈 세팅", location: "세미나실", note: "멘탈 코칭" },
          { date: "10/30", day: "금", time: "06:00-08:30", category: "시드전 1R 맞춤 루틴 체계", detail: "티오프 타임 맞춤 영양 및 워밍업 점검", location: "연습장", note: "영양 및 바이오리듬" },
          { date: "10/30", day: "금", time: "08:30-13:30", category: "최종 18홀 스트로크 시뮬레이션", detail: "야디지북 명시 라인 100% 수행 일관성 테스트, 무감정 루틴 유지", location: "무안CC 본선 코스", note: "야디지북 수용률 100%" },
          { date: "10/30", day: "금", time: "13:30-14:30", category: "중식", detail: "식사", location: "클럽하우스", note: "-" },
          { date: "10/30", day: "금", time: "14:30-16:00", category: "라운드 후 최종 퍼팅 터치 점검", detail: "1m/2m 직선 퍼트 최종 점검 및 릴랙스 터치감 세팅", location: "연습그린", note: "최종 퍼팅 터치감" },
          { date: "10/30", day: "금", time: "16:00-17:00", category: "무안 캠프 최종 마감", detail: "무안 캠프 종합 평가 및 선수별 시드전 최종 가이드 전달", location: "세미나실", note: "최종 가이드 수여" }
        ]
      }
    };

    let activeTabKey = '';
    let appData = JSON.parse(localStorage.getItem('golfSeedAppConfigV5')) || defaultData;
    const SESSION_STORAGE_KEY = 'sytpt_session';

    function hasCoachEditAccess() {
      try {
        const session = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null');
        return Boolean(session && session.role === 'coach' && session.id);
      } catch (error) {
        console.error('Unable to read portal session; schedule editing is disabled.', error);
        return false;
      }
    }

    function requireCoachEditAccess() {
      if (hasCoachEditAccess()) return true;
      showToast('코치 계정으로 로그인해야 스케줄을 수정할 수 있습니다.');
      return false;
    }

    function updateEditAccess() {
      const canEdit = hasCoachEditAccess();
      document.querySelectorAll('.coach-only').forEach((element) => {
        element.hidden = !canEdit;
      });
      const notice = document.getElementById('edit-access-notice');
      notice.hidden = canEdit;
      notice.textContent = localStorage.getItem(SESSION_STORAGE_KEY)
        ? '선수 계정은 훈련 스케줄을 볼 수만 있습니다. 추가·수정·삭제는 코치 계정으로 로그인해 주세요.'
        : '훈련 스케줄을 수정하려면 선수 포탈에서 코치 계정으로 로그인해 주세요.';
    }

    function renderTabs() {
      const tabContainer = document.getElementById('tab-container');
      tabContainer.innerHTML = '';

      const keys = Object.keys(appData);
      if (keys.length === 0) return;

      if (!activeTabKey || !appData[activeTabKey]) {
        activeTabKey = keys[0];
      }

      keys.forEach((key) => {
        const camp = appData[key];
        const btn = document.createElement('button');
        const isActive = (key === activeTabKey);

        btn.className = isActive
          ? "px-5 py-3 font-semibold text-sm rounded-t-lg transition border-b-2 border-blue-600 text-blue-600 bg-blue-50/50 whitespace-nowrap"
          : "px-5 py-3 font-semibold text-sm rounded-t-lg transition text-slate-500 hover:text-slate-800 whitespace-nowrap";

        btn.innerHTML = `<i class="fa-solid fa-list-check mr-2"></i>${key}`;
        btn.onclick = () => switchTab(key);
        tabContainer.appendChild(btn);
      });
    }

    function renderApp() {
      renderTabs();

      const camp = appData[activeTabKey];
      if (!camp) return;
      
      document.getElementById('meta-title').value = camp.title || '';
      document.getElementById('meta-period').value = camp.period || '';
      document.getElementById('meta-location').value = camp.location || '';
      const canEdit = hasCoachEditAccess();
      ['meta-title', 'meta-period', 'meta-location'].forEach((id) => {
        document.getElementById(id).readOnly = !canEdit;
      });

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      camp.rows.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.className = index % 2 === 0 ? 'bg-white hover:bg-slate-50 transition' : 'bg-slate-50/60 hover:bg-slate-100 transition';

        const editable = canEdit ? 'true' : 'false';
        const managementCell = canEdit
          ? `<td class="py-3 px-2 text-center whitespace-nowrap">
              <button onclick="insertRow(${index})" class="text-blue-500 hover:text-blue-700 p-1 transition" title="아래에 시간대 추가">
                <i class="fa-solid fa-square-plus"></i>
              </button>
              <button onclick="deleteRow(${index})" class="text-slate-400 hover:text-rose-600 p-1 transition ml-1" title="시간대 삭제">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>`
          : '';
        tr.innerHTML = `
          <td contenteditable="${editable}" onblur="updateRowData(${index}, 'date', this.innerText)" class="py-3 px-4 font-medium text-slate-900 border-r border-slate-200 text-center whitespace-nowrap">${row.date || ''}</td>
          <td contenteditable="${editable}" onblur="updateRowData(${index}, 'day', this.innerText)" class="py-3 px-3 font-semibold text-blue-700 border-r border-slate-200 text-center">${row.day || ''}</td>
          <td contenteditable="${editable}" onblur="updateRowData(${index}, 'time', this.innerText)" class="py-3 px-4 font-mono text-xs text-blue-900 bg-blue-50/30 font-semibold border-r border-slate-200 text-center">${row.time || ''}</td>
          <td contenteditable="${editable}" onblur="updateRowData(${index}, 'category', this.innerText)" class="py-3 px-4 font-bold text-slate-800 bg-amber-50/20 border-r border-slate-200">${row.category || ''}</td>
          <td contenteditable="${editable}" onblur="updateRowData(${index}, 'detail', this.innerText)" class="py-3 px-6 text-slate-700 border-r border-slate-200 leading-relaxed">${row.detail || ''}</td>
          <td contenteditable="${editable}" onblur="updateRowData(${index}, 'location', this.innerText)" class="py-3 px-4 text-slate-600 border-r border-slate-200">${row.location || ''}</td>
          <td contenteditable="${editable}" onblur="updateRowData(${index}, 'note', this.innerText)" class="py-3 px-4 text-slate-500 border-r border-slate-200 text-xs">${row.note || ''}</td>
          
          ${managementCell}
        `;
        tbody.appendChild(tr);
      });
    }

    function switchTab(tabKey) {
      activeTabKey = tabKey;
      renderApp();
    }

    function updateMeta(field, value) {
      if (!requireCoachEditAccess()) return;
      if (appData[activeTabKey]) {
        appData[activeTabKey][field] = value;
      }
    }

    function updateRowData(index, field, value) {
      if (!requireCoachEditAccess()) return;
      if (appData[activeTabKey] && appData[activeTabKey].rows[index]) {
        appData[activeTabKey].rows[index][field] = value.trim();
      }
    }

    function addNewRow() {
      if (!requireCoachEditAccess()) return;
      const newRow = { date: "", day: "", time: "09:00-10:00", category: "새 소제목/주제", detail: "세부 훈련 내용 입력", location: "연습장", note: "-" };
      appData[activeTabKey].rows.push(newRow);
      renderApp();
      showToast("새 시간대 항목이 추가되었습니다.");
    }

    function insertRow(index) {
      if (!requireCoachEditAccess()) return;
      const currentRow = appData[activeTabKey].rows[index];
      if (!currentRow) return;
      const newRow = {
        date: currentRow.date || "",
        day: currentRow.day || "",
        time: "10:00-11:00",
        category: "새 소제목/주제",
        detail: "세부 훈련 내용 입력",
        location: currentRow.location || "연습장",
        note: "-"
      };
      appData[activeTabKey].rows.splice(index + 1, 0, newRow);
      renderApp();
      showToast("선택한 항목 아래에 새 시간대가 추가되었습니다.");
    }

    function deleteRow(index) {
      if (!requireCoachEditAccess()) return;
      if (confirm("해당 시간대 훈련 항목을 삭제하시겠습니까?")) {
        appData[activeTabKey].rows.splice(index, 1);
        renderApp();
        showToast("시간대 항목이 삭제되었습니다.");
      }
    }

    // Binary Excel Upload Handler with Native SheetJS Parser
    function handleExcelUpload(event) {
      if (!requireCoachEditAccess()) {
        event.target.value = '';
        return;
      }
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array', cellDates: true, cellText: false });

        const newAppData = {};

        workbook.SheetNames.forEach((sheetName) => {
          const sheet = workbook.Sheets[sheetName];
          // Get raw matrix array from SheetJS
          const jsonSheet = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, dateNF: 'YYYY-MM-DD' });
          
          if (jsonSheet && jsonSheet.length > 0) {
            const parsedCamp = parseMatrixData(jsonSheet, sheetName);
            if (parsedCamp.rows.length > 0) {
              newAppData[sheetName] = parsedCamp;
            }
          }
        });

        if (Object.keys(newAppData).length > 0) {
          appData = newAppData;
          activeTabKey = Object.keys(newAppData)[0];
          renderApp();
          showToast("엑셀 파일의 모든 시트가 깨짐 없이 완벽하게 변환되었습니다!");
        } else {
          alert("엑셀 파일 내 유효한 데이터가 없습니다.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // Matrix Data Parser with Date Clean-up & Forward Fill
    function parseMatrixData(matrix, sheetName) {
      let title = sheetName;
      let period = "";
      let location = "";
      let startRow = 0;

      // Extract Title if present in first row
      if (matrix[0] && matrix[0][0]) {
        const firstCell = String(matrix[0][0]).trim();
        if (firstCell.includes('시드전') || firstCell.includes('일정') || firstCell.includes('캠프')) {
          title = firstCell;
          startRow = 1;
        }
      }

      // Skip Header Row if present
      if (matrix[startRow] && (String(matrix[startRow][0]).includes('날짜') || String(matrix[startRow][1]).includes('요일'))) {
        startRow += 1;
      }

      const rows = [];
      let lastDate = "";
      let lastDay = "";

      for (let i = startRow; i < matrix.length; i++) {
        const r = matrix[i];
        if (!r || r.length < 3) continue;

        let rawDate = (r[0] !== undefined && r[0] !== null) ? String(r[0]).trim() : "";
        let rawDay = (r[1] !== undefined && r[1] !== null) ? String(r[1]).trim() : "";

        // Clean ISO Date Time String
        if (rawDate.includes("00:00:00")) {
          rawDate = rawDate.split(" ")[0];
        } else if (rawDate.length > 10 && rawDate.includes("-")) {
          rawDate = rawDate.substring(0, 10);
        }

        // Forward fill for merged cells
        if (rawDate !== "") { lastDate = rawDate; } else { rawDate = lastDate; }
        if (rawDay !== "") { lastDay = rawDay; } else { rawDay = lastDay; }

        const timeVal = (r[2] !== undefined && r[2] !== null) ? String(r[2]).trim() : "";
        const categoryVal = (r[3] !== undefined && r[3] !== null) ? String(r[3]).trim() : "";
        const detailVal = (r[4] !== undefined && r[4] !== null) ? String(r[4]).trim() : "";
        const locationVal = (r[5] !== undefined && r[5] !== null) ? String(r[5]).trim() : "";
        const noteVal = (r[6] !== undefined && r[6] !== null) ? String(r[6]).trim() : "-";

        if (timeVal || categoryVal || detailVal) {
          rows.push({
            date: rawDate,
            day: rawDay,
            time: timeVal,
            category: categoryVal,
            detail: detailVal,
            location: locationVal,
            note: noteVal
          });
        }
      }

      return {
        title: title,
        period: period || "자동 해석된 훈련 일정",
        location: location || "지정 장소",
        rows: rows
      };
    }

    function saveData() {
      if (!requireCoachEditAccess()) return;
      localStorage.setItem('golfSeedAppConfigV5', JSON.stringify(appData));
      showToast("모든 수정사항이 웹 브라우저에 안전하게 저장되었습니다.");
    }

    function resetData() {
      if (!requireCoachEditAccess()) return;
      if (confirm("초기 스케줄 데이터로 리셋하시겠습니까?")) {
        appData = JSON.parse(JSON.stringify(defaultData));
        localStorage.removeItem('golfSeedAppConfigV5');
        activeTabKey = Object.keys(appData)[0];
        renderApp();
        showToast("기본 스케줄로 초기화되었습니다.");
      }
    }

    function exportToCSV() {
      const camp = appData[activeTabKey];
      if (!camp) return;

      let csvContent = "\uFEFF날짜,요일,시간,구분/주제,세부 훈련 내용 및 평가 미션,장소,비고\n";

      camp.rows.forEach(row => {
        const line = [
          `"${row.date || ''}"`,
          `"${row.day || ''}"`,
          `"${row.time || ''}"`,
          `"${row.category || ''}"`,
          `"${row.detail || ''}"`,
          `"${row.location || ''}"`,
          `"${row.note || ''}"`
        ].join(",");
        csvContent += line + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `${camp.title || '훈련일정'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("CSV/엑셀 내보내기가 완료되었습니다.");
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    window.onload = function() {
      updateEditAccess();
      renderApp();
    };

    window.addEventListener('storage', (event) => {
      if (event.key === SESSION_STORAGE_KEY || event.key === null) {
        updateEditAccess();
        renderApp();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        updateEditAccess();
        renderApp();
      }
    });
  </script>
