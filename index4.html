  async function sha256(str){
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  let currentUser = null;
  let isAdmin = false;
  let selectedUserEmail = null; // still used as key for logs and selection

  // Local storage helpers (fallback when Supabase is unavailable)
  function loadUsers(){
    const raw = localStorage.getItem('gsap_users');
    if(!raw) return [];
    try {
      return JSON.parse(raw);
    } catch {
      return [];
    }
  }

  function saveUsers(users){
    localStorage.setItem('gsap_users', JSON.stringify(users));
  }

  // Supabase helpers for cross-device sync
  async function supabaseLoadUsers(){
    try {
      const { data, error } = await sb.from('gsap_users').select('id, hash');
      if(error) {
        // console.warn('Supabase load users failed', error);
        return null;
      }
      return (data || []).map(u => ({ id: u.id, hash: u.hash }));
    } catch (e) {
      return null;
    }
  }

  async function supabaseSaveUser(id, hash){
    try {
      await sb.from('gsap_users').upsert({ id, hash });
    } catch {}
  }

  async function supabaseDeleteUser(id){
    try {
      await sb.from('gsap_users').delete().eq('id', id);
    } catch {}
  }

  async function supabaseLoadLogs(id){
    try {
      const { data, error } = await sb.from('gsap_user_logs').select('when, action').eq('id', id).order('when', { ascending: false }).limit(50);
      if(error) {
        return null;
      }
      return (data || []).map(r => ({ when: r.when, action: r.action }));
    } catch {
      return null;
    }
  }

  async function supabaseAddLog(id, action){
    try {
      await sb.from('gsap_user_logs').insert({ id, action });
    } catch {}
  }

  function loadUserLogs(){
    const raw = localStorage.getItem('gsap_user_logs');
    if(!raw) return {};
    try {
      return JSON.parse(raw);
    } catch {

  async function addUserLog(id, action){
    if(!id) return;
    const now = new Date().toISOString();
    const entry = { when: now, action };

    // Try to save to Supabase (cross-device)
    const supaResult = await supabaseAddLog(id, action);

    // Always keep local copy as well
    const logs = loadUserLogs();
    logs[id] = logs[id] || [];
    logs[id].unshift(entry);
    saveUserLogs(logs);
  }

  async function getUserLogs(id){
    const supaLogs = await supabaseLoadLogs(id);
    if(supaLogs && supaLogs.length > 0){
      return supaLogs;
    }
    const logs = loadUserLogs();
    return logs[id] || [];
  }

  async function initLogin(){
    // Always require login on page load (do not auto-unlock from storage)
    localStorage.removeItem(STORAGE_KEY);
    setLoggedIn(false);
    setAdminMode(false);

    if(userMgmtBtn) {
      userMgmtBtn.addEventListener('click', () => {
        openUserMgmt();
      });
    }

    if(logoutBtn){
      logoutBtn.addEventListener('click', () => {
        setLoggedIn(false);
        window.location.href = 'about:blank';
      });
    }

    loginBtn.addEventListener('click', async () => {
      const rawId = loginEmail.value.trim();
      const id = rawId.toLowerCase();
      const password = loginPassword.value.trim();
      if(!id || !password){
        if(loginStatus) loginStatus.textContent = 'Please enter ID and password.';
        return;
      }

      // Admin credential shortcut (for local/dev access)
      // - ID: admin
      // - Password: admin
      if(id === 'admin' && password === 'admin'){
        currentUser = { id, isAdmin: true };
        setAdminMode(true);
        setLoggedIn(true);
        addUserLog(id, 'admin login');
        if(loginStatus) loginStatus.textContent = 'Admin login successful.';
        return;
      }

      const hash = await sha256(`${id}:${password}`);
      if(hash === ADMIN_HASH){
        currentUser = { id, isAdmin: true };
        setAdminMode(true);
        setLoggedIn(true);
        addUserLog(id, 'admin login');
        if(loginStatus) loginStatus.textContent = 'Admin login successful.';
        return;
      }

      const users = loadUsers();
      const match = users.find(u => u.hash === hash && (u.id === id || u.email === id));
      if(match){
        currentUser = { id, isAdmin: false };
        setAdminMode(false);
        setLoggedIn(true);
        selectedUserEmail = id;
        addUserLog(id, 'login');
        if(loginStatus) loginStatus.textContent = 'User login successful.';
        return;
      }

      if(loginStatus) loginStatus.textContent = 'Invalid credentials.';
    });

    loginPassword.addEventListener('keyup', e => {
      if(e.key === 'Enter') loginBtn.click();
    });
  }

  async function detectMotionStart(video, canvas, ctx) {
    const frames = 30;
    const duration = video.duration;
    if (!Number.isFinite(duration) || duration <= 0) return 0;
    const sampleDuration = Math.min(3, duration); // sample first 3 seconds
    const interval = sampleDuration / frames;
    let prevData = null;
    let startTime = 0;
    const threshold = 1000000; // pixel difference threshold, adjustable
    for (let i = 0; i < frames; i++) {
      const time = i * interval;
      video.currentTime = time;
      await new Promise(resolve => {
        const handler = () => {
          video.removeEventListener('seeked', handler);
          resolve();
        };
        video.addEventListener('seeked', handler);
      });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      if (prevData) {
        let diff = 0;
        for (let j = 0; j < data.length; j += 4) {
          diff += Math.abs(data[j] - prevData[j]) + Math.abs(data[j+1] - prevData[j+1]) + Math.abs(data[j+2] - prevData[j+2]);
        }
        if (diff > threshold) {
          startTime = time;
          break;
        }
      }
      prevData = new Uint8ClampedArray(data);
    }
    return startTime;
  }

  function ensureVideoReady(video){
    if(video.readyState >= 2){
      return Promise.resolve();
    }
    return new Promise(resolve => {
      const onReady = () => {
        video.removeEventListener('loadeddata', onReady);
        video.removeEventListener('canplay', onReady);
        resolve();
      };
      video.addEventListener('loadeddata', onReady, { once: true });
      video.addEventListener('canplay', onReady, { once: true });
    });
  }

  function seekVideoTo(video, time){
    if(!Number.isFinite(time)){
      return Promise.resolve();
    }
    if(Math.abs(video.currentTime - time) < 0.01){
      return Promise.resolve();
    }
    return new Promise(resolve => {
      const onSeeked = () => {
        video.removeEventListener('seeked', onSeeked);
        resolve();
      };
      video.addEventListener('seeked', onSeeked, { once: true });
      video.currentTime = time;
    });
  }

  function updateStatus(){
    const parts = [];
    const baseRate = parseFloat(playbackRateInput.value);
    const safeBaseRate = Number.isFinite(baseRate) && baseRate > 0 ? baseRate : 1;
    if(isFinite(frontVideo.duration) && frontVideo.duration > 0){
      const aRate = (safeBaseRate * frontSpeedFactor).toFixed(2);
      parts.push(`A ${frontVideo.duration.toFixed(2)}s @${aRate}x`);
    }
    if(isFinite(sideVideo.duration) && sideVideo.duration > 0){
      const bRate = (safeBaseRate * sideSpeedFactor).toFixed(2);
      parts.push(`B ${sideVideo.duration.toFixed(2)}s @${bRate}x`);
    }
    statusSpan.textContent = parts.join(' | ');
  }

  function syncCanvasSize(canvas){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(Math.round(rect.width * dpr), 1);
    const height = Math.max(Math.round(rect.height * dpr), 1);
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  }

  function getVideoMetrics(video, boxWidth, boxHeight, zoom=1){
    const defaultAspect = 16 / 9;
    const videoAspect = (video.videoWidth && video.videoHeight)
      ? video.videoWidth / video.videoHeight
      : defaultAspect;
    const boxAspect = boxWidth / boxHeight;
    let drawWidth = boxWidth;
    let drawHeight = boxHeight;
    if (videoAspect > boxAspect) {
      drawWidth = boxWidth;
      drawHeight = boxWidth / videoAspect;
    } else {
      drawHeight = boxHeight;
      drawWidth = boxHeight * videoAspect;
    }

    const zoomedWidth = drawWidth * zoom;
    const zoomedHeight = drawHeight * zoom;
    const offsetX = (boxWidth - zoomedWidth) / 2;
    const offsetY = (boxHeight - zoomedHeight) / 2;

    return { offsetX, offsetY, drawWidth: zoomedWidth, drawHeight: zoomedHeight };
  }

  function drawOverlay(ctx, points, lines, canvas, video, zoom=1, previewLine=null){
    syncCanvasSize(canvas);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const metrics = getVideoMetrics(video, canvas.width, canvas.height, zoom);
    const rect = canvas.getBoundingClientRect();
    const scale = rect.width > 0 ? canvas.width / rect.width : 1;
    const radius = 6 * scale;
    const lineWidth = 2 * scale;

    ctx.fillStyle = 'yellow';
    ctx.strokeStyle = 'red';
    ctx.lineWidth = lineWidth;

    points.forEach(p => {
      const x = metrics.offsetX + p.x * metrics.drawWidth;
      const y = metrics.offsetY + p.y * metrics.drawHeight;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    });

    lines.forEach(line => {
      const startX = metrics.offsetX + line.start.x * metrics.drawWidth;
      const startY = metrics.offsetY + line.start.y * metrics.drawHeight;
      const endX = metrics.offsetX + line.end.x * metrics.drawWidth;
      const endY = metrics.offsetY + line.end.y * metrics.drawHeight;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
    });

    if(previewLine){
      ctx.save();
      ctx.strokeStyle = 'cyan';
      ctx.lineWidth = lineWidth;
      ctx.setLineDash([6 * scale, 4 * scale]);
      const startX = metrics.offsetX + previewLine.start.x * metrics.drawWidth;
      const startY = metrics.offsetY + previewLine.start.y * metrics.drawHeight;
      const endX = metrics.offsetX + previewLine.end.x * metrics.drawWidth;
      const endY = metrics.offsetY + previewLine.end.y * metrics.drawHeight;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPointsOnFrame(ctx, points, width, height){
    ctx.save();
    ctx.fillStyle = 'yellow';
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;

    points.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x * width, p.y * height, 6, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  function drawLinesOnFrame(ctx, lines, width, height){
    ctx.save();
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;

    lines.forEach(line => {
      ctx.beginPath();
      ctx.moveTo(line.start.x * width, line.start.y * height);
      ctx.lineTo(line.end.x * width, line.end.y * height);
      ctx.stroke();
    });

    ctx.restore();
  }

  function resizeVideosAndCanvases(){
    drawOverlay(frontCtx, frontPoints, frontLines, frontCanvas, frontVideo, frontZoom);
    drawOverlay(sideCtx, sidePoints, sideLines, sideCanvas, sideVideo, sideZoom);
  }
  window.addEventListener('resize', resizeVideosAndCanvases);

  function getNormalizedCoords(event, canvas, video, zoom){
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if(event.touches && event.touches.length > 0){
      clientX = event.touches[0].clientX;
      clientY = event.touches[0].clientY;
    } else {
      clientX = event.clientX;
      clientY = event.clientY;
    }

    const metrics = getVideoMetrics(video, rect.width, rect.height, zoom);
    if (metrics.drawWidth <= 0 || metrics.drawHeight <= 0) {
      return null;
    }

    const x = (clientX - rect.left - metrics.offsetX) / metrics.drawWidth;
    const y = (clientY - rect.top - metrics.offsetY) / metrics.drawHeight;

    if (x < 0 || x > 1 || y < 0 || y > 1) {
      return null;
    }

    return { x, y };
  }

  function deletePoint(points, lines, pos, ctx, canvas, video, zoom, threshold=0.03){
    // First attempt to remove a selected line
    for(let i=0; i<lines.length; i++){
      const { start, end } = lines[i];
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const len2 = dx*dx + dy*dy;
      let dist2;
      if(len2 === 0){
        const px = pos.x - start.x;
        const py = pos.y - start.y;
        dist2 = px*px + py*py;
      } else {
        const t = ((pos.x - start.x) * dx + (pos.y - start.y) * dy) / len2;
        if(t <= 0){
          const px = pos.x - start.x;
          const py = pos.y - start.y;
          dist2 = px*px + py*py;
        } else if(t >= 1){
          const px = pos.x - end.x;
          const py = pos.y - end.y;
          dist2 = px*px + py*py;
        } else {
          const projx = start.x + t * dx;
          const projy = start.y + t * dy;
          const px = pos.x - projx;
          const py = pos.y - projy;
          dist2 = px*px + py*py;
        }
      }
      if(dist2 < threshold*threshold){
        lines.splice(i, 1);
        drawOverlay(ctx, points, lines, canvas, video, zoom);
        return true;
      }
    }

    // Remove selected point (not line)
    for(let i=0; i<points.length; i++){
      const dx = points[i].x - pos.x;
      const dy = points[i].y - pos.y;
      if(dx*dx + dy*dy < threshold*threshold){
        points.splice(i,1);
        drawOverlay(ctx, points, lines, canvas, video, zoom);
        return true;
      }
    }
    return false;
  }

  function addPoint(points, lines, pos, ctx, canvas, video, zoom){
    points.push(pos); // add without count limit
    drawOverlay(ctx, points, lines, canvas, video, zoom);
  }

  function onCanvasClick(event, points, lines, ctx, canvas, video, zoomGetter){
    event.preventDefault();
    const zoom = zoomGetter();
    const pos = getNormalizedCoords(event, canvas, video, zoom);
    if(!pos) return;
    if(deletePoint(points, lines, pos, ctx, canvas, video, zoom)) return;
    addPoint(points, lines, pos, ctx, canvas, video, zoom);
  }

  function startPointer(event, points, lines, ctx, canvas, video, zoomGetter, view){
    event.preventDefault();
    const zoom = zoomGetter();
    const pos = getNormalizedCoords(event, canvas, video, zoom);
    if(!pos) return;
    activePointer = { points, lines, ctx, canvas, video, zoomGetter, view, startPos: pos, currentPos: pos };
    pointerIsDragging = false;
    canvas.setPointerCapture(event.pointerId);
  }

  function movePointer(event){
    if(!activePointer) return;
    const { canvas, video, zoomGetter, startPos, ctx, points, lines } = activePointer;
    const zoom = zoomGetter();
    const pos = getNormalizedCoords(event, canvas, video, zoom);
    if(!pos) return;
    const dx = pos.x - startPos.x;
    const dy = pos.y - startPos.y;
    const dist = Math.hypot(dx, dy);
    if(dist > 0.01){
      pointerIsDragging = true;
      activePointer.currentPos = pos;
      drawOverlay(ctx, points, lines, canvas, video, zoom, { start: startPos, end: pos });
    }
  }

  function endPointer(event){
    if(!activePointer) return;
    const { points, lines, ctx, canvas, video, zoomGetter, view, startPos, currentPos } = activePointer;
    const zoom = zoomGetter();
    const pos = getNormalizedCoords(event, canvas, video, zoom);
    const endPos = (pos && pointerIsDragging) ? pos : currentPos;
    const dx = endPos.x - startPos.x;
    const dy = endPos.y - startPos.y;
    const dist = Math.hypot(dx, dy);

    const isTap = !pointerIsDragging || dist <= 0.01;
    const now = performance.now();
    const wasDoubleTap = isTap &&
      lastTapView === view &&
      now - lastTapTime < 350 &&
      lastTapPos &&
      Math.hypot(endPos.x - lastTapPos.x, endPos.y - lastTapPos.y) < 0.03;

    if(pointerIsDragging && dist > 0.01){
      lines.push({ start: startPos, end: endPos });
      drawOverlay(ctx, points, lines, canvas, video, zoom);
    } else if(wasDoubleTap){
      setSelectedView(view);
      lastTapTime = 0;
      lastTapView = null;
      lastTapPos = null;
    } else if(isTap){
      lastTapTime = now;
      lastTapView = view;
      lastTapPos = endPos;
      onCanvasClick(event, points, lines, ctx, canvas, video, zoomGetter);
    }

    activePointer = null;
    pointerIsDragging = false;
    if(event.pointerId) canvas.releasePointerCapture(event.pointerId);
  }

  frontCanvas.addEventListener('pointerdown', e => startPointer(e, frontPoints, frontLines, frontCtx, frontCanvas, frontVideo, () => frontZoom, 'front'));
  frontCanvas.addEventListener('pointermove', movePointer);
  frontCanvas.addEventListener('pointerup', endPointer);
  frontCanvas.addEventListener('pointercancel', endPointer);
  frontCanvas.addEventListener('pointerleave', endPointer);

  sideCanvas.addEventListener('pointerdown', e => startPointer(e, sidePoints, sideLines, sideCtx, sideCanvas, sideVideo, () => sideZoom, 'side'));
  sideCanvas.addEventListener('pointermove', movePointer);
  sideCanvas.addEventListener('pointerup', endPointer);
  sideCanvas.addEventListener('pointercancel', endPointer);
  sideCanvas.addEventListener('pointerleave', endPointer);

  function checkButtonsEnabled(){
    playPauseBothBtn.disabled = !(frontVideo.src && sideVideo.src);
    frontPlayBtn.disabled = !frontVideo.src;
    sidePlayBtn.disabled = !sideVideo.src;
    frontSlider.disabled = !frontVideo.src;
    sideSlider.disabled = !sideVideo.src;
    saveFrameBtn.disabled = !(frontVideo.src || sideVideo.src);
    frontPrevFrameBtn.disabled = !frontVideo.src;
    frontNextFrameBtn.disabled = !frontVideo.src;
    sidePrevFrameBtn.disabled = !sideVideo.src;
    sideNextFrameBtn.disabled = !sideVideo.src;
    const selectionActive = selectedView !== null;
    frontZoomRange.disabled = selectionActive || !frontVideo.src;
    sideZoomRange.disabled = selectionActive || !sideVideo.src;
    frontSpeedRange.disabled = !frontVideo.src;
    sideSpeedRange.disabled = !sideVideo.src;
    if(playPauseBothBtn.disabled){
      updateDualPlayButtonLabel(false);
    }
    updateSelectionButtons();
  }

  function loadVideo(videoElem, file){
    videoElem.src = URL.createObjectURL(file);
    applyPlaybackRates();
  }

  function setFileName(spanId, file){
    document.getElementById(spanId).textContent = file ? file.name : '';
  }

  async function handleFrontVideoFile(file){
    setFileName('frontFileName', file);
    if(!file) return;
    loadVideo(frontVideo, file);
    frontPoints = [];
    frontLines = [];
    frontZoom = 1;
    frontZoomRange.value = frontZoom;
    frontSpeedFactor = 1;
    frontSpeedRange.value = frontSpeedFactor;
    applyVideoZoom(frontVideo, frontZoom);
    applyPlaybackRates();
    drawOverlay(frontCtx, frontPoints, frontLines, frontCanvas, frontVideo, frontZoom);
    pauseBothVideos();
    firstDualPlay = true;
    setSelectedView(null);
    checkButtonsEnabled();
    updateStatus();
    // detect motion start
    frontMotionStart = await detectMotionStart(frontVideo, frontCanvas, frontCtx);
  }

  async function handleSideVideoFile(file){
    setFileName('sideFileName', file);
    if(!file) return;
    loadVideo(sideVideo, file);
    sidePoints = [];
    sideLines = [];
    sideZoom = 1;
    sideZoomRange.value = sideZoom;
    sideSpeedFactor = 1;
    sideSpeedRange.value = sideSpeedFactor;
    applyVideoZoom(sideVideo, sideZoom);
    applyPlaybackRates();
    drawOverlay(sideCtx, sidePoints, sideLines, sideCanvas, sideVideo, sideZoom);
    pauseBothVideos();
    firstDualPlay = true;
    setSelectedView(null);
    checkButtonsEnabled();
    updateStatus();
    // detect motion start
    sideMotionStart = await detectMotionStart(sideVideo, sideCanvas, sideCtx);
  }

  frontFileInput.addEventListener('change', async (e) => {
    await handleFrontVideoFile(e.target.files[0]);
  });
  frontCameraInput.addEventListener('change', async (e) => {
    await handleFrontVideoFile(e.target.files[0]);
  });
  sideFileInput.addEventListener('change', async (e) => {
    await handleSideVideoFile(e.target.files[0]);
  });
  sideCameraInput.addEventListener('change', async (e) => {
    await handleSideVideoFile(e.target.files[0]);
  });

  frontFileBtn.addEventListener('click', () => frontFileInput.click());
  frontCameraBtn.addEventListener('click', () => frontCameraInput.click());
  sideFileBtn.addEventListener('click', () => sideFileInput.click());
  sideCameraBtn.addEventListener('click', () => sideCameraInput.click());

  frontVideo.addEventListener('loadedmetadata', () => {
    resizeVideosAndCanvases();
    frontSlider.max = frontVideo.duration;
    frontSlider.value = 0;
    applyVideoZoom(frontVideo, frontZoom);
    updateStatus();
  });
  sideVideo.addEventListener('loadedmetadata', () => {
    resizeVideosAndCanvases();
    sideSlider.max = sideVideo.duration;
    sideSlider.value = 0;
    applyVideoZoom(sideVideo, sideZoom);
    updateStatus();
  });

  frontPlayBtn.addEventListener('click', () => {
    if(frontVideo.paused){ frontVideo.play(); } else { frontVideo.pause(); }
  });
  sidePlayBtn.addEventListener('click', () => {
    if(sideVideo.paused){ sideVideo.play(); } else { sideVideo.pause(); }
  });

  frontPrevFrameBtn.addEventListener('click', () => {
    frontVideo.pause();
    frontVideo.currentTime = Math.max(0, frontVideo.currentTime - (1/30));
  });
  frontNextFrameBtn.addEventListener('click', () => {
    frontVideo.pause();
    frontVideo.currentTime = Math.min(frontVideo.duration, frontVideo.currentTime + (1/30));
  });
  sidePrevFrameBtn.addEventListener('click', () => {
    sideVideo.pause();
    sideVideo.currentTime = Math.max(0, sideVideo.currentTime - (1/30));
  });
  sideNextFrameBtn.addEventListener('click', () => {
    sideVideo.pause();
    sideVideo.currentTime = Math.min(sideVideo.duration, sideVideo.currentTime + (1/30));
  });

  playbackRateInput.addEventListener('input', () => {
    applyPlaybackRates();
    updateStatus();
  });

  frontSlider.addEventListener('input', () => { frontVideo.currentTime = frontSlider.value; lastMovedVideo = 'front'; });
  sideSlider.addEventListener('input', () => { sideVideo.currentTime = sideSlider.value; lastMovedVideo = 'side'; });

  function setFrontZoom(value){
    const zoom = Math.min(Math.max(value, 0.2), 4);
    frontZoom = zoom;
    frontZoomRange.value = zoom;
    applyVideoZoom(frontVideo, zoom);
    drawOverlay(frontCtx, frontPoints, frontLines, frontCanvas, frontVideo, zoom);
  }

  function setSideZoom(value){
    const zoom = Math.min(Math.max(value, 0.2), 4);
    sideZoom = zoom;
    sideZoomRange.value = zoom;
    applyVideoZoom(sideVideo, zoom);
    drawOverlay(sideCtx, sidePoints, sideLines, sideCanvas, sideVideo, zoom);
  }

  frontZoomRange.addEventListener('input', () => {
    setFrontZoom(parseFloat(frontZoomRange.value));
  });

  sideZoomRange.addEventListener('input', () => {
    setSideZoom(parseFloat(sideZoomRange.value));
  });

  const frontZoomIn = document.getElementById('frontZoomIn');
  const frontZoomOut = document.getElementById('frontZoomOut');
  const sideZoomIn = document.getElementById('sideZoomIn');
  const sideZoomOut = document.getElementById('sideZoomOut');

  if(frontZoomIn) frontZoomIn.addEventListener('click', () => setFrontZoom(frontZoom * 1.12));
  if(frontZoomOut) frontZoomOut.addEventListener('click', () => setFrontZoom(frontZoom * 0.88));
  if(sideZoomIn) sideZoomIn.addEventListener('click', () => setSideZoom(sideZoom * 1.12));
  if(sideZoomOut) sideZoomOut.addEventListener('click', () => setSideZoom(sideZoom * 0.88));

  if(selectFrontBtn){
    selectFrontBtn.addEventListener('click', () => setSelectedView('front'));
  }
  if(selectSideBtn){
    selectSideBtn.addEventListener('click', () => setSelectedView('side'));
  }
  if(selectBothBtn){
    selectBothBtn.addEventListener('click', () => setSelectedView(null));
  }

  frontCanvas.addEventListener('wheel', e => {
    if(selectedView) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.88;
    setFrontZoom(frontZoom * factor);
  });

  sideCanvas.addEventListener('wheel', e => {
    if(selectedView) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.88;
    setSideZoom(sideZoom * factor);
  });

  frontSpeedRange.addEventListener('input', () => {
    frontSpeedFactor = parseFloat(frontSpeedRange.value);
    applyPlaybackRates();
    updateStatus();
  });

  sideSpeedRange.addEventListener('input', () => {
    sideSpeedFactor = parseFloat(sideSpeedRange.value);
    applyPlaybackRates();
    updateStatus();
  });

  function syncSliders() {
    if(!frontSlider.disabled && !frontSlider.matches(':active')){
      frontSlider.value = frontVideo.currentTime;
    }
    if(!sideSlider.disabled && !sideSlider.matches(':active')){
      sideSlider.value = sideVideo.currentTime;
    }
    requestAnimationFrame(syncSliders);
  }
  function updateDualPlayButtonLabel(isPlaying){
    playPauseBothBtn.textContent = isPlaying ? "⏸" : "▶";
    playPauseBothBtn.title = isPlaying ? "Pause both" : "Play both";
  }

  function synchronizeCurrentTime(){
    const frontTime = frontVideo.currentTime;
    const sideTime = sideVideo.currentTime;
    if(!isFinite(frontTime) || !isFinite(sideTime)) return;
    const delta = frontTime - sideTime;
    const threshold = 0.5; // allow 0.5s difference
    const baseRate = parseFloat(playbackRateInput.value);
    const safeBaseRate = Number.isFinite(baseRate) && baseRate > 0 ? baseRate : 1;
    if(Math.abs(delta) > threshold){
      if(delta > 0){
        // if front is ahead, slow front and speed up side
        frontVideo.playbackRate = safeBaseRate * frontSpeedFactor * 0.8;
        sideVideo.playbackRate = safeBaseRate * sideSpeedFactor * 1.2;
      } else {
        frontVideo.playbackRate = safeBaseRate * frontSpeedFactor * 1.2;
        sideVideo.playbackRate = safeBaseRate * sideSpeedFactor * 0.8;
      }
    } else {
      // If difference is small, reset to normal speed
      frontVideo.playbackRate = safeBaseRate * frontSpeedFactor;
      sideVideo.playbackRate = safeBaseRate * sideSpeedFactor;
    }
  }

  async function playBothVideos(){
    if(dualPlayInProgress){
      return;
    }
    dualPlayInProgress = true;
    frontVideo.pause();
    sideVideo.pause();
    applyPlaybackRates();

    try {
      await Promise.all([ensureVideoReady(frontVideo), ensureVideoReady(sideVideo)]);
      if(firstDualPlay){
        await Promise.all([seekVideoTo(frontVideo, frontMotionStart), seekVideoTo(sideVideo, sideMotionStart)]);
        firstDualPlay = false;
      }
      // On subsequent play, resume from current position without seeking
      lastMovedVideo = null;

      const playPromises = [frontVideo, sideVideo].map(video => {
        try {
          const result = video.play();
          if(result && typeof result.then === 'function'){
            return result.catch(() => {});
          }
          return Promise.resolve();
        } catch (err) {
          return Promise.resolve();
        }
      });

      await Promise.allSettled(playPromises);
      if(syncIntervalId) clearInterval(syncIntervalId);
      syncIntervalId = setInterval(synchronizeCurrentTime, 100);
    } finally {
      const bothPlaying = !frontVideo.paused && !sideVideo.paused;
      updateDualPlayButtonLabel(bothPlaying);
      dualPlayInProgress = false;
    }
  }

  function pauseBothVideos(){
    if(!frontVideo.paused){ frontVideo.pause(); }
    if(!sideVideo.paused){ sideVideo.pause(); }
    dualPlayInProgress = false;
    updateDualPlayButtonLabel(false);
    applyPlaybackRates(); // reset playback rate
    if(syncIntervalId){
      clearInterval(syncIntervalId);
      syncIntervalId = null;
    }
  }

  function toggleDualPlayback(){
    if(!frontVideo.src || !sideVideo.src) return;
    const shouldPlay = frontVideo.paused || sideVideo.paused;
    if(shouldPlay){
      playBothVideos();
    } else {
      pauseBothVideos();
    }
  }

  applyVideoZoom(frontVideo, frontZoom);
  applyVideoZoom(sideVideo, sideZoom);
  applyPlaybackRates();
  resizeVideosAndCanvases();
  syncSliders();
  updateStatus();
  updateDualPlayButtonLabel(false);
  updateSelectionButtons();

  playPauseBothBtn.addEventListener('click', toggleDualPlayback);

  frontVideo.addEventListener('play', () => {
    if(!sideVideo.paused){
      updateDualPlayButtonLabel(true);
    }
  });
  sideVideo.addEventListener('play', () => {
    if(!frontVideo.paused){
      updateDualPlayButtonLabel(true);
    }
  });

  frontVideo.addEventListener('pause', () => {
    if(sideVideo.paused){
      updateDualPlayButtonLabel(false);
    }
  });
  sideVideo.addEventListener('pause', () => {
    if(frontVideo.paused){
      updateDualPlayButtonLabel(false);
    }
  });

  frontVideo.addEventListener('ended', () => {
    pauseBothVideos();
  });
  sideVideo.addEventListener('ended', () => {
    pauseBothVideos();
  });

  clearPointsBtn.addEventListener('click', () => {
    frontPoints = [];
    sidePoints = [];
    frontLines = [];
    sideLines = [];
    drawOverlay(frontCtx, frontPoints, frontLines, frontCanvas, frontVideo, frontZoom);
    drawOverlay(sideCtx, sidePoints, sideLines, sideCanvas, sideVideo, sideZoom);
  });

  saveFrameBtn.addEventListener('click', () => {
    if(!frontVideo.paused || !sideVideo.paused){
      alert("Pause the video(s) before saving.");
      return;
    }
    if(frontPoints.length === 0 && sidePoints.length === 0 && frontLines.length === 0 && sideLines.length === 0){
      alert("Cannot save without any points or lines.");
      return;
    }

    // When in AB mode (selectedView === null), include any loaded videos.
    const includeFront = selectedView === 'front' || (selectedView === null && !!frontVideo.src);
    const includeSide = selectedView === 'side' || (selectedView === null && !!sideVideo.src);

    if(selectedView === 'front' && !frontVideo.src){
      alert("Front video is not loaded.");
      return;
    }
    if(selectedView === 'side' && !sideVideo.src){
      alert("Side video is not loaded.");
      return;
    }

    const gap = (includeFront && includeSide) ? 10 : 0;
    const frontZoomedWidth = (frontVideo.videoWidth || 640) * frontZoom;
    const frontZoomedHeight = (frontVideo.videoHeight || 360) * frontZoom;
    const sideZoomedWidth = (sideVideo.videoWidth || 640) * sideZoom;
    const sideZoomedHeight = (sideVideo.videoHeight || 360) * sideZoom;

    let width = 0;
    let height = 0;
    if(includeFront && includeSide){
      width = frontZoomedWidth + gap + sideZoomedWidth;
      height = Math.max(frontZoomedHeight, sideZoomedHeight);
    } else if(includeFront){
      width = frontZoomedWidth;
      height = frontZoomedHeight;
    } else if(includeSide){
      width = sideZoomedWidth;
      height = sideZoomedHeight;
    } else {
      alert("No view selected to save.");
      return;
    }

    const panoramaCanvas = document.createElement('canvas');
    panoramaCanvas.width = width;
    panoramaCanvas.height = height;
    const pCtx = panoramaCanvas.getContext('2d');

    if(includeFront){
      pCtx.drawImage(frontVideo, 0, 0, frontZoomedWidth, frontZoomedHeight);
      drawPointsOnFrame(pCtx, frontPoints, frontZoomedWidth, frontZoomedHeight);
      drawLinesOnFrame(pCtx, frontLines, frontZoomedWidth, frontZoomedHeight);
    }

    if(includeSide){
      const offsetX = includeFront ? frontZoomedWidth + gap : 0;
      pCtx.save();
      pCtx.translate(offsetX, 0);
      pCtx.drawImage(sideVideo, 0, 0, sideZoomedWidth, sideZoomedHeight);
      drawPointsOnFrame(pCtx, sidePoints, sideZoomedWidth, sideZoomedHeight);
      drawLinesOnFrame(pCtx, sideLines, sideZoomedWidth, sideZoomedHeight);
      pCtx.restore();
    }

    panoramaCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `swing_frame_capture_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  });
</script>

</body>
</html>
